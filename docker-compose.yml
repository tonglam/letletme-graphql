x-app-image: &app-image ${APP_IMAGE:-letletme-graphql:local}
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  graphql:
    image: *app-image
    build:
      context: .
      target: runner
    env_file: ${APP_ENV_FILE:-.env.deploy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
    networks:
      - graphql_shared
    logging: *default-logging
    ports:
      - "127.0.0.1:${GRAPHQL_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4000/health/hot').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  graphql_shared:
    external: true
    name: ${GRAPHQL_SHARED_NETWORK:-letletme_graphql_default}
