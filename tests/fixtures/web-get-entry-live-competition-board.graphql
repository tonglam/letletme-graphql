query GetEntryLiveCompetitionBoard(
	$entryId: Int!
	$tournamentId: Int!
	$eventId: Int!
	$ref: LivePublicationRefInput
	$page: Int
	$pageSize: Int
	$sort: EntryLiveCompetitionBoardSort
	$direction: EntryLiveCompetitionBoardSortDirection
	$search: String
	$chips: [String!]
	$captainPlayerIds: [Int!]
	$ownership: EntryLiveCompetitionOwnershipFilterInput
	$teamCountRules: [EntryLiveCompetitionTeamCountRuleInput!]
	$expectedBoardRevision: String
) {
	entryLiveCompetitionBoard(
		entryId: $entryId
		tournamentId: $tournamentId
		eventId: $eventId
		ref: $ref
		page: $page
		pageSize: $pageSize
		sort: $sort
		direction: $direction
		search: $search
		chips: $chips
		captainPlayerIds: $captainPlayerIds
		ownership: $ownership
		teamCountRules: $teamCountRules
		expectedBoardRevision: $expectedBoardRevision
	) {
		season
		eventId
		tournamentId
		boardRevision
		scoreCoreRevision
		dataAvailability
		revisions {
			publicationId
			generation
			lifecycle
			fixtureIdentity
			scoreCore
			displayStats
			explain
			picksBase
			officialAdjustment
			previousTotals
			finalResult
			rules
			algorithm
			input
		}
		times {
			sourceCheckedAt
			contentUpdatedAt
			publishedAt
			checkpointedAt
			servedAt
			staleAt
			nextRefreshAt
		}
		delivery {
			state
			servedFrom
			reasonCodes
		}
		coverageState
		rankScope
		computedEntries
		deferredEntryCount
		failedEntryCount
		unavailableEntryCount
		officialCoverage
		unavailableEntryIds
		failedEntryIds
		partial
		totalEntries
		filteredEntries
		page
		pageSize
		hasMore
		highestEventPoints
		averageEventPoints
		rows {
			...EntryLiveCompetitionBoardRowFields
		}
		viewerRow {
			...EntryLiveCompetitionBoardRowFields
		}
	}
}

fragment EntryLiveCompetitionBoardRowFields on EntryLiveCompetitionBoardRow {
	entry
	entryName
	playerName
	rank
	overallRank
	teamValue
	chip
	transferCost
	played
	toPlay
	captainId
	captainName
	captainPoints
	score {
		eventPoints
		netEventPoints
		totalPoints
		totalScope
		transferCost
		source
		calculationMode
		revisions {
			publicationId
			generation
			lifecycle
			fixtureIdentity
			scoreCore
			displayStats
			explain
			picksBase
			officialAdjustment
			previousTotals
			finalResult
			rules
			algorithm
			input
		}
		times {
			sourceCheckedAt
			contentUpdatedAt
			publishedAt
			checkpointedAt
			servedAt
			staleAt
			nextRefreshAt
		}
		delivery {
			state
			servedFrom
			reasonCodes
		}
	}
}
