query GetEntryLiveCompetitionBoard(
	$entryId: Int!
	$tournamentId: Int!
	$eventId: Int!
	$input: EntryLiveCompetitionBoardInput
) {
	entryLiveCompetitionBoard(
		entryId: $entryId
		tournamentId: $tournamentId
		eventId: $eventId
		input: $input
	) {
		head {
			season
			eventId
			tournamentId
			mode
			availability
			contentRevision
			nextRefreshAt
			publication {
				revisions {
					publicationId
					generation
					scoreCore
				}
				times {
					contentUpdatedAt
					nextRefreshAt
				}
			}
			delivery {
				state
			}
		}
		totalEntries
		filteredEntries
		pageInfo {
			hasNextPage
			endCursor
		}
		highestEventPoints
		averageEventPoints
		rows {
			...EntryLiveCompetitionBoardRowFields
		}
		viewerRow {
			...EntryLiveCompetitionBoardRowFields
		}
	}
}

fragment EntryLiveCompetitionBoardRowFields on EntryLiveCompetitionBoardRow {
	availability
	entry
	entryName
	playerName
	liveRank
	overallRank
	teamValue
	chip
	transferCost
	played
	toPlay
	captainId
	captainName
	captainPoints
	score { ...LivePointsScoreSummaryFields }
}

fragment LivePointsScoreSummaryFields on LiveScore {
	eventPoints
	netEventPoints
	totalPoints
	totalScope
	transferCost
	source
	calculationMode
	revisions { input }
	times { sourceCheckedAt contentUpdatedAt nextRefreshAt }
	delivery { state }
}
