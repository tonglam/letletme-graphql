query GetLiveCalcPoints($eventId: Int!, $entryId: Int!) {
	calcLivePointsByEntry(eventId: $eventId, entryId: $entryId) {
		entry
		event
		availability
		entryName
		playerName
		chip
		delivery {
			state
			servedFrom
			reasonCodes
		}
		snapshot {
			season
			eventId
			state
			revisions {
				publicationId
				generation
				lifecycle
				fixtureIdentity
				scoreCore
				displayStats
				explain
				picksBase
				officialAdjustment
				previousTotals
				finalResult
				rules
				algorithm
				input
			}
			times {
				sourceCheckedAt
				contentUpdatedAt
				publishedAt
				checkpointedAt
				servedAt
				staleAt
				nextRefreshAt
			}
			delivery {
				state
				servedFrom
				reasonCodes
			}
		}
		score {
			eventPoints
			netEventPoints
			totalPoints
			totalScope
			transferCost
			source
			calculationMode
			revisions {
				publicationId
				generation
				lifecycle
				fixtureIdentity
				scoreCore
				displayStats
				explain
				picksBase
				officialAdjustment
				previousTotals
				finalResult
				rules
				algorithm
				input
			}
			times {
				sourceCheckedAt
				contentUpdatedAt
				publishedAt
				checkpointedAt
				servedAt
				staleAt
				nextRefreshAt
			}
			delivery {
				state
				servedFrom
				reasonCodes
			}
		}
		rank {
			eventRank
			overallRank
			leagueRank
			revision
			contentUpdatedAt
			state
		}
		captainName
		pickList {
			element
			elementType
			position
			webName
			teamName
			teamShortName
			minutes
			goalsScored
			assists
			cleanSheets
			goalsConceded
			defensiveContribution
			ownGoals
			penaltiesSaved
			penaltiesMissed
			yellowCards
			redCards
			saves
			bonus
			bps
			totalPoints
			starts
			isGwStarted
			isGwFinished
			isPlayed
			isCaptain
			isViceCaptain
			multiplier
			pickActive
			autoSub
			bgw
			expectedGoals
			expectedAssists
			expectedGoalInvolvements
			expectedGoalsConceded
			inDreamTeam
		}
	}
}
