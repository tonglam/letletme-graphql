query GetLiveCalcPoints($eventId: Int!, $entryId: Int!) {
	calcLivePointsByEntry(eventId: $eventId, entryId: $entryId) {
		entry
		event
		entryName
		playerName
		chip
		score {
			eventPoints
			netEventPoints
			totalPoints
			totalScope
			eventRank
			overallRank
			leagueRank
			transferCost
			source
			state
			eventPointSemantics
			calculationMode
			algorithmVersion
			provenance {
				scoreSource
				calculationMode
				algorithmVersion
				inputRevision
				scoreRevision
				rankRevision
				livePublicationId
				liveRevision
				liveCheckedAt
				picksRevision
				picksCheckedAt
				previousTotalsRevision
				previousTotalsThroughEventId
				resultRevision
				resultCheckedAt
				dataCheckedAt
				rankSource
				rankCheckedAt
			}
			effectiveLineup {
				elementId
				position
				sourceMultiplier
				effectiveMultiplier
				pickActive
				autoSub
				isCaptain
				isViceCaptain
				captainForScoring
			}
			revision
			checkedAt
			upstreamUpdatedAt
			staleAt
			nextRefreshAt
			reconciliation
			reasonCodes
		}
		snapshot {
			eventId
			revision
			state
			publishedAt
			checkedAt
		}
		livePoints
		transferCost
		liveNetPoints
		liveTotalPoints
		captainName
		pickList {
			element
			elementType
			position
			webName
			teamName
			teamShortName
			minutes
			goalsScored
			assists
			cleanSheets
			goalsConceded
			defensiveContribution
			ownGoals
			penaltiesSaved
			penaltiesMissed
			yellowCards
			redCards
			saves
			bonus
			bps
			totalPoints
			starts
			isGwStarted
			isGwFinished
			isPlayed
			isCaptain
			isViceCaptain
			multiplier
			pickActive
			autoSub
			bgw
			expectedGoals
			expectedAssists
			expectedGoalInvolvements
			expectedGoalsConceded
			inDreamTeam
		}
	}
}
