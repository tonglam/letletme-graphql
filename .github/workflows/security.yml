name: Scheduled security

on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      - name: Build production image
        run: docker build --build-arg "VCS_REVISION=$GITHUB_SHA" --tag letletme-graphql:security-scan .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: letletme-graphql:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  contract-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare fixed Data contract with Data main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixed_sha=$(tr -d '[:space:]' < .github/data-platform-contract-ref)
          [[ "$fixed_sha" =~ ^[0-9a-f]{40}$ ]]
          data_main_sha=$(gh api repos/tonglam/letletme_data/commits/main --jq '.sha')
          printf 'fixed Data SHA: %s\nData main SHA: %s\n' "$fixed_sha" "$data_main_sha"
          if [ "$fixed_sha" != "$data_main_sha" ]; then
            echo "::warning::Data main advanced beyond the pinned contract. A dedicated pin-bump PR with compatibility evidence is required; this informational drift check does not fail CI."
          fi
