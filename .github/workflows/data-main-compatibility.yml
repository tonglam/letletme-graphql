name: Data main compatibility

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-main-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rate-limit-redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACT_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
      REDIS_URL: redis://127.0.0.1:6379
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6380
      NODE_ENV: test
    steps:
      - name: Checkout GraphQL main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Data main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tonglam/letletme_data
          ref: main
          path: data-platform
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install Data main dependencies
        working-directory: data-platform
        run: bun install --frozen-lockfile

      - name: Apply Data main baseline
        working-directory: data-platform
        run: bun run db:migrate

      - name: Provide plain-PG Supabase identities
        run: |
          psql "$CONTRACT_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $fn$ SELECT current_setting('request.jwt.claim.role', true) $fn$;
          SQL

      - name: Verify Data main migration is repeatable
        working-directory: data-platform
        run: |
          bun run db:migrate
          bun run db:migrate:status

      - name: Record Data main candidate identity
        id: data-candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha=$(git -C data-platform rev-parse HEAD)
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Data main candidate SHA: $candidate_sha"

      - name: Install GraphQL dependencies
        run: bun install --frozen-lockfile

      - name: Install Data-owned GraphQL authority fixture
        run: >-
          psql "$CONTRACT_ADMIN_DATABASE_URL" -f
          data-platform/tests/fixtures/graphql-consumer-authority.sql

      - name: Refresh reporting materialized views for the authority fixture
        run: |
          psql "$CONTRACT_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          REFRESH MATERIALIZED VIEW reporting.tournament_entry_event_summaries;
          REFRESH MATERIALIZED VIEW reporting.tournament_selection_stats;
          SQL

      - name: Install GraphQL external-boundary contract fixture
        run: psql "$CONTRACT_ADMIN_DATABASE_URL" -f tests/fixtures/database-contract.sql

      - name: Run complete GraphQL startup contract against Data main
        env:
          DATABASE_URL: postgresql://graphql_ci:graphql_ci@127.0.0.1:5432/testdb
          DATA_CANDIDATE_SHA: ${{ steps.data-candidate.outputs.sha }}
        run: bun scripts/check-data-main-compatibility.ts

      - name: Validate isolated Redis clients
        env:
          DATABASE_URL: postgresql://graphql_ci:graphql_ci@127.0.0.1:5432/testdb
        run: bun run redis:check

      - name: Validate GraphQL consumers against Data main
        env:
          DATABASE_URL: postgresql://graphql_ci:graphql_ci@127.0.0.1:5432/testdb
          RUN_DATABASE_CONTRACT_INTEGRATION: "1"
        run: |
          bunx tsc --noEmit
          bun test \
            tests/graphql \
            tests/infra/data-contract-ref.test.ts \
            tests/infra/database-contract.test.ts \
            tests/infra/read-model-client.test.ts \
            tests/domains/public-league-trends/database-contract.integration.test.ts
