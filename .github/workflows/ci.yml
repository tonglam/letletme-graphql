name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-supabase-key
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/testdb
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      PORT: "4000"
      LOG_LEVEL: info
      CACHE_TTL_SECONDS: "60"
      JWT_SECRET: test-jwt-secret
      BETTER_AUTH_SECRET: test-better-auth-secret
      BETTER_AUTH_URL: http://localhost:4000
      GRAPHQL_AUTH_MODE: enforce
      CORS_ORIGIN: http://localhost:3000
      CORS_CREDENTIALS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          # Scan the working tree only (not git history). Rotate any previously
          # committed credentials separately; history rewrite is a manual ops step.
          ./gitleaks detect --source . --no-git --verbose --config .gitleaks.toml

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build check
        run: bun build src/index.ts --target bun --outdir /tmp/build-check
