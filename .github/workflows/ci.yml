name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_KEY: test-supabase-key
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  PORT: "4000"
  LOG_LEVEL: info
  CACHE_TTL_SECONDS: "60"
  BACKEND_PROXY_SECRET: test-backend-proxy-secret
  GRAPHQL_AUTH_MODE: enforce
  CORS_ORIGIN: http://localhost:3000
  CORS_CREDENTIALS: "false"
  TRUSTED_PROXY_HOPS: "0"
  LEGACY_WECHAT_ISSUANCE_ENABLED: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bun build src/index.ts --target bun --outdir /tmp/build-check

      - name: Validate Compose
        env:
          APP_ENV_FILE: .env.example
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.12

      - run: bun install --frozen-lockfile

      - name: Bootstrap domain-owned dependencies
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/test-bootstrap.sql

      - name: Apply migrations twice
        run: |
          bun run migrate
          bun run migrate
          bun run migrate:status

      - name: Exercise migration, auth, cache, and request boundaries
        env:
          RUN_MIGRATION_INTEGRATION: "true"
        run: >-
          bun test
          tests/migrations/security.integration.test.ts
          tests/http/security.test.ts
          tests/graphql/limits.test.ts
          tests/infra/season.test.ts
