name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://graphql_ci:graphql_ci@127.0.0.1:5432/testdb
  DATABASE_STATEMENT_TIMEOUT_MS: "12000"
  REDIS_URL: redis://127.0.0.1:6379
  RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6380
  PORT: "4000"
  LOG_LEVEL: info
  BACKEND_PROXY_SECRET: test-backend-proxy-secret
  GRAPHQL_SERVICE_TOKEN: test-graphql-service-token-at-least-32-characters
  CORS_ORIGIN: http://localhost:3000
  GRAPHQL_RATE_LIMIT_MODE: shadow-v3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test --coverage

      - name: Critical My FPL coverage
        run: bun run coverage:critical

      - name: Build
        run: bun build src/index.ts --target bun --outdir /tmp/build-check

      - name: Validate Compose
        env:
          APP_ENV_FILE: .env.example
        run: docker compose config --quiet

      - name: Verify GraphQL owns no business migrations
        shell: bash
        run: |
          test ! -d migrations
          ! grep -Eiq 'bun run (migrate|db:migrate|db:apply-sql)' \
            .github/workflows/deploy.yml Dockerfile docker-compose.yml
          ! grep -Eiq 'supabase|@supabase' package.json src/infra/env.ts src/infra/database.ts

  database-contract:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rate-limit-redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout GraphQL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read fixed Data Platform contract reference
        id: data-contract
        shell: bash
        run: |
          set -euo pipefail
          ref=$(tr -d '[:space:]' < .github/data-platform-contract-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout current Data Platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tonglam/letletme_data
          ref: ${{ steps.data-contract.outputs.ref }}
          path: data-platform
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install GraphQL dependencies
        run: bun install --frozen-lockfile

      - name: Install current Data Platform dependencies
        working-directory: data-platform
        run: bun install --frozen-lockfile

      - name: Apply current Data Platform baseline
        working-directory: data-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: bun run db:migrate

      - name: Provide plain-PG Supabase identities
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $fn$ SELECT current_setting('request.jwt.claim.role', true) $fn$;
          SQL

      - name: Verify current Data Platform migration is repeatable
        working-directory: data-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          bun run db:migrate
          bun run db:migrate:status

      - name: Install GraphQL consumer contract fixture
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: psql "$DATA_DATABASE_URL" -f tests/fixtures/database-contract.sql

      - name: Validate startup against the real PG15 catalog
        run: bun run contract:check

      - name: Validate isolated Redis clients
        run: bun run redis:check

      - name: Exercise reader, resolver, and fail-closed contract cases
        env:
          RUN_DATABASE_CONTRACT_INTEGRATION: "1"
        run: >-
          bun test
          tests/infra/read-model-client.test.ts
          tests/infra/database-contract.test.ts
          tests/domains/public-league-trends/database-contract.integration.test.ts
