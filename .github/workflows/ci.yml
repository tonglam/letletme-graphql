name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://graphql_ci:graphql_ci@127.0.0.1:5432/testdb
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  PORT: "4000"
  LOG_LEVEL: info
  BACKEND_PROXY_SECRET: test-backend-proxy-secret
  GRAPHQL_SERVICE_TOKEN: test-graphql-service-token-at-least-32-characters
  CORS_ORIGIN: http://localhost:3000
  CORS_CREDENTIALS: "false"
  TRUSTED_PROXY_HOPS: "0"
  GRAPHQL_BROWSER_INGRESS_RATE_LIMIT: "120"
  GRAPHQL_AUTHENTICATED_RATE_LIMIT: "300"
  GRAPHQL_ANONYMOUS_RATE_LIMIT: "120"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build
        run: bun build src/index.ts --target bun --outdir /tmp/build-check

      - name: Validate Compose
        env:
          APP_ENV_FILE: .env.example
        run: docker compose config --quiet

      - name: Verify GraphQL owns no business migrations
        shell: bash
        run: |
          test ! -d migrations
          ! grep -Eiq 'bun run (migrate|db:migrate|db:apply-sql)' \
            .github/workflows/deploy.yml Dockerfile docker-compose.yml
          ! grep -Eiq 'supabase|@supabase' package.json src/infra/env.ts src/infra/database.ts

  database-contract:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout GraphQL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout current Data Platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tonglam/letletme_data
          # Pin the Data contract that contains the official H2H mirror migration.
          ref: 8ce8e3b0003a61b6392374dda36f8e53c015c024
          path: data-platform
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install GraphQL dependencies
        run: bun install --frozen-lockfile

      - name: Install current Data Platform dependencies
        working-directory: data-platform
        run: bun install --frozen-lockfile

      - name: Apply current Data Platform baseline
        working-directory: data-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: bun run db:migrate

      - name: Provide plain-PG Supabase identities
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $fn$ SELECT current_setting('request.jwt.claim.role', true) $fn$;
          SQL

      - name: Verify current Data Platform migration is repeatable
        working-directory: data-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          bun run db:migrate
          bun run db:migrate:status

      - name: Install canonical core publication contract fixture
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO fpl.seasons (
            season_id,
            season_code,
            display_name,
            start_year,
            end_year,
            lifecycle_state,
            is_current
          ) VALUES (
            2026,
            '2627',
            '2026/27',
            2026,
            2027,
            'preseason',
            TRUE
          )
          ON CONFLICT (season_id) DO UPDATE
          SET is_current = TRUE, lifecycle_state = 'preseason', updated_at = now();

          INSERT INTO ops.dataset_publications (
            publication_id,
            dataset,
            season_id,
            event_id,
            revision,
            status,
            manifest,
            activated_at
          ) VALUES (
            '00000000-0000-4000-8000-000000000007',
            'fpl:core',
            2026,
            NULL,
            7,
            'active',
            jsonb_build_object(
              'dataset', 'fpl:core',
              'seasonCode', '2627',
              'eventId', NULL,
              'revision', 7,
              'publicationId', '00000000-0000-4000-8000-000000000007',
              'sourceCheckedAt', '2026-08-10T00:00:00.000Z',
              'publishedAt', '2026-08-10T00:00:01.000Z',
              'state', 'active',
              'items', jsonb_build_array(
                jsonb_build_object('name', 'events', 'key', 'llm:data:fpl:core:2627:7:events', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64)),
                jsonb_build_object('name', 'teams', 'key', 'llm:data:fpl:core:2627:7:teams', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64)),
                jsonb_build_object('name', 'players', 'key', 'llm:data:fpl:core:2627:7:players', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64)),
                jsonb_build_object('name', 'phases', 'key', 'llm:data:fpl:core:2627:7:phases', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64)),
                jsonb_build_object('name', 'fixtures', 'key', 'llm:data:fpl:core:2627:7:fixtures', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64)),
                jsonb_build_object('name', 'currentEventId', 'key', 'llm:data:fpl:core:2627:7:currentEventId', 'type', 'string', 'count', 0, 'bytes', 2, 'sha256', repeat('0', 64))
              )
            ),
            now()
          )
          ON CONFLICT (publication_id) DO UPDATE
          SET status = 'active', manifest = EXCLUDED.manifest, activated_at = now(), updated_at = now();

          DO $$
          BEGIN
            IF (
              SELECT count(*)
              FROM ops.dataset_publications publication
              JOIN fpl.seasons season ON season.season_id = publication.season_id
              WHERE publication.dataset = 'fpl:core'
                AND publication.event_id IS NULL
                AND publication.status = 'active'
                AND season.is_current
                AND jsonb_array_length(publication.manifest -> 'items') = 6
            ) <> 1 THEN
              RAISE EXCEPTION 'expected one canonical core publication fixture';
            END IF;
          END
          $$;
          SQL

      - name: Refresh canonical reporting models
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          REFRESH MATERIALIZED VIEW reporting.tournament_entry_event_summaries;
          REFRESH MATERIALIZED VIEW reporting.tournament_selection_stats;
          SQL

      - name: Create exact Web auth reader fixture
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS bauth;
          CREATE TABLE bauth."user" (
            id text PRIMARY KEY,
            email text,
            fpl_entry_id integer,
            fpl_entry_verified_at timestamptz
          );
          CREATE TABLE bauth.mini_program_session (
            id text PRIMARY KEY,
            user_id text NOT NULL,
            token_hash text NOT NULL,
            revoked_at timestamptz,
            expires_at timestamptz NOT NULL,
            device_id text
          );
          REVOKE ALL ON SCHEMA bauth FROM PUBLIC;
          REVOKE ALL ON ALL TABLES IN SCHEMA bauth FROM PUBLIC;
          GRANT USAGE ON SCHEMA bauth TO letletme_graphql_reader;
          GRANT SELECT (id, fpl_entry_id, fpl_entry_verified_at)
            ON bauth."user" TO letletme_graphql_reader;
          GRANT SELECT (user_id, token_hash, revoked_at, expires_at)
            ON bauth.mini_program_session TO letletme_graphql_reader;
          SQL

      - name: Create disposable read-only GraphQL login
        env:
          DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: |
          psql "$DATA_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE graphql_ci
            LOGIN PASSWORD 'graphql_ci'
            NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          GRANT letletme_graphql_reader TO graphql_ci;
          SQL

      - name: Validate startup against the real PG15 catalog
        run: bun run contract:check

      - name: Exercise reader, resolver, and fail-closed contract cases
        env:
          RUN_DATABASE_CONTRACT_INTEGRATION: "1"
        run: >-
          bun test
          tests/infra/read-model-client.test.ts
          tests/infra/database-contract.test.ts
          tests/domains/public-league-trends/database-contract.integration.test.ts
