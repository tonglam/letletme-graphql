name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Resolve protected main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "${WORKFLOW_SHA:-$main_sha}"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push once
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --tag "${IMAGE_NAME}:latest" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          GRAPHQL_ENV: ${{ secrets.GRAPHQL_ENV }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,GRAPHQL_ENV
          script: |
            set -euo pipefail
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin
            cd "$VPS_WORKDIR"
            git fetch origin main
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            umask 077
            printf '%s' "$GRAPHQL_ENV" > .env.deploy
            chmod 600 .env.deploy

            old_container=$(docker compose ps -q graphql)
            if [ -n "$old_container" ]; then
              old_image=$(docker inspect --format '{{.Config.Image}}' "$old_container")
              test -n "$old_image"
              printf '%s\n' "$old_image" > /home/workspace/.letletme-graphql-previous-image
            fi

            APP_IMAGE="$IMAGE_REF" docker compose pull graphql
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T graphql bun run contract:check
            APP_IMAGE="$IMAGE_REF" docker compose up -d --remove-orphans --no-build graphql

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker logs --tail 100 "$(docker compose ps -q graphql)" || true
                exit 1
              fi
              sleep 2
            done

            container=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q graphql)
            test -n "$container"
            test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$IMAGE_REF"
            docker compose ps graphql
            docker image prune --force
