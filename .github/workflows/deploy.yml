name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual dispatch ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set deployment metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_SHA="${GITHUB_SHA}"
          fi
          IMAGE_NAME=$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${IMAGE_NAME}:${DEPLOY_SHA} \
            --tag ${IMAGE_NAME}:latest \
            --push .
          echo "IMAGE_REF=${IMAGE_NAME}:${DEPLOY_SHA}" >> $GITHUB_ENV

      - name: Deploy on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          GRAPHQL_ENV: ${{ secrets.GRAPHQL_ENV }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,IMAGE_REF,IMAGE_NAME,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,GRAPHQL_ENV
          script: |
            set -euo pipefail
            LOWER_USER=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin

            # First-time setup: clone repo if workdir doesn't exist
            if [ ! -d "$VPS_WORKDIR/.git" ]; then
              mkdir -p "$VPS_WORKDIR"
              git clone https://github.com/tonglam/letletme-graphql.git "$VPS_WORKDIR"
            fi

            cd "$VPS_WORKDIR"
            git fetch --all
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"

            # Write env file from secret
            printf '%s' "$GRAPHQL_ENV" > .env.deploy

            APP_IMAGE="$IMAGE_REF" docker compose pull graphql
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T graphql bun run migrate
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T graphql bun run migrate:status
            APP_IMAGE="$IMAGE_REF" docker compose up -d --remove-orphans --no-build

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed"
                APP_IMAGE="$IMAGE_REF" docker compose ps
                APP_IMAGE="$IMAGE_REF" docker compose logs --tail 100 graphql || true
                exit 1
              fi
              sleep 2
            done

            APP_IMAGE="$IMAGE_REF" docker compose ps

            # Retain the current and previous two repository images. Never prune
            # unrelated images on this shared VPS.
            KEEP_FILE=.deployed-graphql-images
            KEEP_TMP=$(mktemp)
            {
              printf '%s\n' "$IMAGE_REF"
              if [ -f "$KEEP_FILE" ]; then cat "$KEEP_FILE"; fi
            } | awk '!seen[$0]++' | head -n 3 > "$KEEP_TMP"
            mv "$KEEP_TMP" "$KEEP_FILE"

            docker image ls "$IMAGE_NAME" --format '{{.Repository}}:{{.Tag}}' | while read -r REF; do
              if [ "$REF" = "$IMAGE_NAME:latest" ] || grep -Fxq "$REF" "$KEEP_FILE"; then
                continue
              fi
              docker image rm "$REF" || true
            done
