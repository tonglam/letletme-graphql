name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Resolve protected main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "${WORKFLOW_SHA:-$main_sha}"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push once
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --tag "${IMAGE_NAME}:latest" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          GRAPHQL_ENV: ${{ secrets.GRAPHQL_ENV }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,GRAPHQL_ENV,RUN_ID,RUN_ATTEMPT
          script: |
            set -euo pipefail
            exec 9>/run/letletme-vps-ops/maintenance.lock
            flock -w 300 9 || { echo "another VPS deployment or cleanup is running" >&2; exit 75; }
            deployment_started=false
            deployment_committed=false
            controller_committed=false
            env_promoted=false
            previous_env=""
            deployment_run_id="${RUN_ID:-graphql-${DEPLOY_SHA}}-${RUN_ATTEMPT:-1}"
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            active_stage=""
            stage_started_at=0
            start_stage() {
              active_stage="$1"
              stage_started_at=$(date +%s%3N)
            }
            finish_stage() {
              finished_at=$(date +%s%3N)
              duration_ms=$(( finished_at - stage_started_at ))
              printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"passed","durationMs":%s}\n' \
                "$active_stage" "$duration_ms"
              active_stage=""
            }
            fail_without_rollback_on_exit() {
              original_status=$?
              trap - EXIT
              set +e
              if [ "$original_status" -ne 0 ] && [ -n "$active_stage" ]; then
                failed_at=$(date +%s%3N)
                failed_duration_ms=$(( failed_at - stage_started_at ))
                printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"failed","durationMs":%s}\n' \
                  "$active_stage" "$failed_duration_ms"
              fi
              if [ -n "${next_env:-}" ]; then
                rm -f "$next_env"
              fi
              if [ -n "${previous_env:-}" ]; then
                rm -f "$previous_env"
              fi
              if [ "$original_status" -ne 0 ] && [ "${deployment_started:-false}" = true ] && [ "${deployment_committed:-false}" = false ]; then
                VPS_MAINTENANCE_LOCK_HELD=1 /usr/local/libexec/vps-maintenance deployment fail \
                  --service=graphql --run-id="$deployment_run_id" --reason="deploy exit $original_status" >/dev/null || true
              fi
              exit "$original_status"
            }
            trap fail_without_rollback_on_exit EXIT
            image_name=${IMAGE_REF%@*}
            [[ "$image_name" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
            case "$VPS_WORKDIR" in
              /*) ;;
              *) echo "VPS_WORKDIR must be an absolute path"; exit 1 ;;
            esac
            test "$VPS_WORKDIR" != "/"

            start_stage checkout
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin

            if [ ! -d "$VPS_WORKDIR/.git" ]; then
              if [ -d "$VPS_WORKDIR" ] && [ -n "$(find "$VPS_WORKDIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "GraphQL VPS workdir exists but is not an empty Git checkout"
                exit 1
              fi
              mkdir -p "$(dirname "$VPS_WORKDIR")"
              git clone https://github.com/tonglam/letletme-graphql.git "$VPS_WORKDIR"
            fi

            cd "$VPS_WORKDIR"
            git diff --quiet || { echo "GraphQL VPS checkout has tracked modifications"; exit 1; }
            git diff --cached --quiet || { echo "GraphQL VPS index has staged modifications"; exit 1; }
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            finish_stage

            start_stage envValidate
            umask 077
            next_env=$(mktemp "$VPS_WORKDIR/.env.deploy.next.XXXXXX")
            printf '%s' "$GRAPHQL_ENV" > "$next_env"
            chmod 600 "$next_env"
            python3 - "$next_env" <<'PY'
            import re
            import sys
            from pathlib import Path
            from urllib.parse import unquote, urlsplit

            env_path = Path(sys.argv[1])
            lines = env_path.read_text(encoding="utf-8").splitlines()
            database_url_indexes = [
                index for index, line in enumerate(lines) if line.startswith("DATABASE_URL=")
            ]
            if len(database_url_indexes) != 1:
                raise SystemExit("GRAPHQL_ENV must contain exactly one DATABASE_URL")

            index = database_url_indexes[0]
            raw_value = lines[index].split("=", 1)[1]
            value = raw_value
            if len(raw_value) >= 2 and raw_value[0] == raw_value[-1] and raw_value[0] in ("'", '"'):
                value = raw_value[1:-1]

            parsed = urlsplit(value)
            username = unquote(parsed.username or "")
            hostname = (parsed.hostname or "").lower()
            if parsed.scheme not in ("postgres", "postgresql"):
                raise SystemExit("DATABASE_URL must use the postgres or postgresql scheme")
            pooler_role = (
                re.fullmatch(r"[^.]+\.pooler\.supabase\.com", hostname)
                and re.fullmatch(r"letletme_graphql_runtime\.[^.]+", username)
            )
            if username != "letletme_graphql_runtime" and not pooler_role:
                raise SystemExit("DATABASE_URL must use letletme_graphql_runtime")
            if not hostname:
                raise SystemExit("DATABASE_URL must include a host")
            if not parsed.password:
                raise SystemExit("DATABASE_URL must include the GraphQL runtime credential")
            PY
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config --quiet
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config | grep -q 'max-size: 20m'
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config | grep -Eq 'max-file: "5"$'
            if [ -f .env.deploy ]; then
              previous_env=$(mktemp "$VPS_WORKDIR/.env.deploy.previous.XXXXXX")
              cp .env.deploy "$previous_env"
              chmod 600 "$previous_env"
            fi
            finish_stage

            old_container=$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
              docker compose ps --all -q graphql | head -n 1)
            old_image=""
            if [ -n "$old_container" ]; then
              old_image=$(docker inspect --format '{{.Config.Image}}' "$old_container")
              test -n "$old_image"
              docker image inspect "$old_image" >/dev/null
            fi

            VPS_MAINTENANCE_LOCK_HELD=1 /usr/local/libexec/vps-maintenance deployment begin \
              --service=graphql --run-id="$deployment_run_id" --old-image="$old_image" --new-image="$IMAGE_REF" >/dev/null
            deployment_started=true

            start_stage pull
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose pull graphql
            finish_stage
            start_stage preflight
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
              docker compose run --rm -T graphql bun run contract:check
            finish_stage

            rollback_armed=false
            rollback_graphql_on_exit() {
              original_status=$?
              trap - EXIT
              set +e
              if [ "$original_status" -ne 0 ] && [ -n "$active_stage" ]; then
                failed_at=$(date +%s%3N)
                failed_duration_ms=$(( failed_at - stage_started_at ))
                printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"failed","durationMs":%s}\n' \
                  "$active_stage" "$failed_duration_ms"
                active_stage=""
              fi
              if [ "$rollback_armed" = true ] && [ "$deployment_committed" = false ]; then
                if [ -n "$old_image" ]; then
                  echo "GraphQL deployment failed; restoring the previous image"
                  rollback_env="$next_env"
                  if [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                    mv "$previous_env" .env.deploy
                    chmod 600 .env.deploy
                    rollback_env=.env.deploy
                  elif [ "$env_promoted" = true ] && [ -f .env.deploy ]; then
                    rollback_env=.env.deploy
                  fi
                  APP_ENV_FILE="$rollback_env" APP_IMAGE="$old_image" docker compose up \
                    -d --no-deps --no-build --force-recreate graphql
                  rollback_restored=false
                  for rollback_attempt in $(seq 1 30); do
                    if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                      rollback_restored=true
                      break
                    fi
                    sleep 2
                  done
                  if [ "$rollback_restored" = true ]; then
                    echo "GraphQL rollback restored the previous image"
                  else
                    echo "GraphQL rollback failed to restore a healthy service"
                    APP_ENV_FILE="$rollback_env" APP_IMAGE="$old_image" \
                      docker compose logs --tail 100 graphql || true
                  fi
                else
                  echo "GraphQL deployment failed without a previous image; removing the failed container"
                  rollback_cleanup_env="$next_env"
                  if [ "$env_promoted" = true ]; then
                    if [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                      mv "$previous_env" .env.deploy
                      chmod 600 .env.deploy
                      rollback_cleanup_env=.env.deploy
                    elif [ -f .env.deploy ]; then
                      rollback_cleanup_env=.env.deploy
                    fi
                  fi
                  APP_ENV_FILE="$rollback_cleanup_env" APP_IMAGE="$IMAGE_REF" \
                    docker compose rm --stop --force graphql || true
                fi
              fi
              if [ "$env_promoted" = false ] && [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                rm -f "$previous_env"
              fi
              if [ "$original_status" -ne 0 ] && [ "$deployment_started" = true ] && [ "$deployment_committed" = false ]; then
                VPS_MAINTENANCE_LOCK_HELD=1 /usr/local/libexec/vps-maintenance deployment fail \
                  --service=graphql --run-id="$deployment_run_id" --reason="deploy exit $original_status" >/dev/null || true
              fi
              rm -f "$next_env"
              exit "$original_status"
            }
            trap rollback_graphql_on_exit EXIT
            rollback_armed=true

            start_stage replace
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose stop -t 30 graphql
            test -z "$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps -q graphql)"
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose up \
              -d --remove-orphans --no-build --force-recreate graphql
            finish_stage

            start_stage serviceReady
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
                  docker compose logs --tail 100 graphql || true
                exit 1
              fi
              sleep 2
            done
            finish_stage

            start_stage smoke
            anonymous_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"query":"query { currentEventInfo { season } }"}' \
              http://127.0.0.1:4000/graphql)
            test "$anonymous_status" = '401'

            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose exec -T graphql bun -e '
              const token = process.env.GRAPHQL_SERVICE_TOKEN;
              if (!token) throw new Error("Missing GRAPHQL_SERVICE_TOKEN");
              const request = async (query, variables = {}) => {
                const response = await fetch("http://127.0.0.1:4000/graphql", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "X-GraphQL-Service-Token": token,
                  },
                  body: JSON.stringify({ query, variables }),
                });
                const payload = await response.json();
                if (response.status !== 200 || payload.errors) {
                  throw new Error("GraphQL deployment smoke failed: " + JSON.stringify(payload.errors));
                }
                return payload.data;
              };
              const data = await request(`query DeploymentSmoke {
                currentEventInfo { season currentEvent nextEvent }
                players(limit: 1) { id webName price }
              }`);
              const info = data?.currentEventInfo;
              if (
                !/^[0-9]{4}$/.test(info?.season ?? "") ||
                !Array.isArray(data?.players) ||
                data.players.length !== 1
              ) {
                throw new Error("GraphQL deployment core contract failed");
              }
              const eventId =
                Number.isInteger(info.currentEvent) && info.currentEvent > 0
                  ? info.currentEvent
                  : Number.isInteger(info.nextEvent) && info.nextEvent > 0
                    ? info.nextEvent
                    : null;
              if (!eventId) throw new Error("GraphQL deployment has no current or next event");
              const live = await request(
                `query LiveDeploymentSmoke($eventId: Int!) {
                  liveSnapshot(eventId: $eventId) {
                    season eventId revision state eventLiveCount fixtureCount
                  }
                }`,
                { eventId },
              );
              const snapshot = live?.liveSnapshot;
              if (snapshot?.season !== info.season || snapshot?.eventId !== eventId) {
                throw new Error("GraphQL deployment live contract failed");
              }
              console.log(JSON.stringify({
                status: "graphql_deployment_contract_passed",
                season: info.season,
                eventId,
                liveState: snapshot.state,
              }));
            '

            container=$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps -q graphql)
            test -n "$container"
            test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$IMAGE_REF"
            for attempt in $(seq 1 20); do
              container_health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              if [ "$container_health" = 'healthy' ]; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "GraphQL container health did not settle: $container_health"
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
                  docker compose logs --tail 100 graphql || true
                exit 1
              fi
              sleep 3
            done
            finish_stage

            start_stage finalize
            mv "$next_env" .env.deploy
            chmod 600 .env.deploy
            env_promoted=true

            VPS_MAINTENANCE_LOCK_HELD=1 /usr/local/libexec/vps-maintenance deployment commit \
              --service=graphql --run-id="$deployment_run_id" >/dev/null
            controller_committed=true
            deployment_committed=true
            if [ -n "$old_image" ]; then
              printf '%s\n' "$old_image" > "$HOME/.letletme-graphql-previous-image"
              chmod 600 "$HOME/.letletme-graphql-previous-image"
            fi
            if [ -n "$previous_env" ]; then
              rm -f "$previous_env"
            fi
            finish_stage
            VPS_MAINTENANCE_LOCK_HELD=1 /usr/local/libexec/vps-maintenance cleanup \
              --mode=deploy --service=graphql || true
            docker system df || true
            rollback_armed=false
            trap - EXIT
            scoped_dangling_images=$(docker image ls --quiet \
              --filter "reference=${image_name}:*" \
              --filter dangling=true | sort -u)
            while IFS= read -r dangling_image; do
              if [ -n "$dangling_image" ]; then
                docker image rm "$dangling_image"
              fi
            done <<< "$scoped_dangling_images"
            if [ -n "$old_image" ]; then
              docker image inspect "$old_image" >/dev/null
            fi
            APP_IMAGE="$IMAGE_REF" docker compose ps graphql
