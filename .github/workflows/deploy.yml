name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rate_limit_rollout:
        description: Persisted GraphQL rate-limit rollout profile
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - shadow-v3
          - enforce-v3
          - shadow-v4
          - enforce-v4
          - secret

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Resolve protected main and exact CI run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          workflow_sha="${WORKFLOW_SHA:-}"
          test -z "$workflow_sha" || test "$main_sha" = "$workflow_sha"
          ci_run_id=""
          if [ -z "$workflow_sha" ]; then
            runs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=20")
            ci_run_id=$(printf '%s' "$runs_json" | jq -r --arg sha "$main_sha"               '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.id) | last | .id // empty')
            test -n "$ci_run_id" || {
              echo "No completed successful ci.yml push run found for exact main SHA $main_sha"
              exit 1
            }
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate versioned deploy script
        run: bash -n scripts/deploy-remote.sh

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VCS_REVISION=${{ steps.target.outputs.sha }}" \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${digest}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Scan immutable image before deployment
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Configure pinned OpenSSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          test -n "$VPS_SSH_FINGERPRINT"
          ssh_dir="$RUNNER_TEMP/letletme-graphql-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          fingerprints=$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "$(printf '%s\n' "$fingerprints" | sed '/^$/d' | wc -l)" -eq 1
          test "$fingerprints" = "$VPS_SSH_FINGERPRINT"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Deploy candidate to inactive slot and verify public traffic
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          ACTIVE_SLOT_FILE: ${{ vars.VPS_ACTIVE_SLOT_FILE }}
          SWITCH_HELPER: ${{ vars.VPS_GRAPHQL_SLOT_SWITCH_HELPER }}
          PUBLIC_GRAPHQL_HEALTH_URL: ${{ vars.PUBLIC_GRAPHQL_HEALTH_URL }}
          PUBLIC_GRAPHQL_URL: ${{ vars.PUBLIC_GRAPHQL_URL }}
          GRAPHQL_ENV: ${{ secrets.GRAPHQL_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          RATE_LIMIT_ROLLOUT: ${{ inputs.rate_limit_rollout || 'preserve' }}
        run: |
          set -euo pipefail
          case "$VPS_WORKDIR" in /*) ;; *) echo "VPS_WORKDIR must be absolute"; exit 1 ;; esac
          test "$VPS_WORKDIR" != "/"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$GRAPHQL_ENV"
          ssh_common=(-i "$SSH_DIR/id_ed25519"
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts")
          target="$VPS_USER@$VPS_HOST"
          umask 077
          payload_dir=$(mktemp -d "$RUNNER_TEMP/letletme-graphql-payload.XXXXXX")
          cleanup_payloads() {
            rm -rf -- "$payload_dir"
          }
          trap cleanup_payloads EXIT
          printf '%s' "$GRAPHQL_ENV" > "$payload_dir/env.expected"
          printf '%s' "$GHCR_TOKEN" > "$payload_dir/token.expected"
          base64 --wrap=0 < "$payload_dir/env.expected" > "$payload_dir/env.b64"
          base64 --wrap=0 < "$payload_dir/token.expected" > "$payload_dir/token.b64"
          base64 --decode "$payload_dir/env.b64" > "$payload_dir/env.decoded"
          base64 --decode "$payload_dir/token.b64" > "$payload_dir/token.decoded"
          cmp -s "$payload_dir/env.expected" "$payload_dir/env.decoded" || {
            echo "GraphQL environment payload failed local base64 round-trip" >&2
            exit 1
          }
          cmp -s "$payload_dir/token.expected" "$payload_dir/token.decoded" || {
            echo "GHCR token payload failed local base64 round-trip" >&2
            exit 1
          }
          env_b64=$(<"$payload_dir/env.b64")
          token_b64=$(<"$payload_dir/token.b64")
          printf -v deploy_sha_q '%q' "$DEPLOY_SHA"
          printf -v image_ref_q '%q' "$IMAGE_REF"
          printf -v ghcr_user_q '%q' "$GHCR_USER"
          printf -v workdir_q '%q' "$VPS_WORKDIR"
          printf -v active_file_q '%q' "${ACTIVE_SLOT_FILE:-/var/lib/letletme-graphql/active-slot}"
          printf -v helper_q '%q' "${SWITCH_HELPER:-/usr/local/sbin/letletme-graphql-switch-slot}"
          printf -v public_health_q '%q' "$PUBLIC_GRAPHQL_HEALTH_URL"
          printf -v public_graphql_q '%q' "$PUBLIC_GRAPHQL_URL"
          printf -v rollout_q '%q' "$RATE_LIMIT_ROLLOUT"
          # Create and populate both secret files inside the same remote shell
          # that installs cleanup traps. If this SSH session drops while either
          # payload is being uploaded, the remote EXIT trap still removes the
          # files; no second connection is required for cleanup.
          {
            cat <<'REMOTE_WRAPPER'
          set -euo pipefail
          remote_env=""
          remote_token=""
          cleanup_staged_secrets() {
            if [ -n "$remote_env" ]; then rm -f -- "$remote_env" || true; fi
            if [ -n "$remote_token" ]; then rm -f -- "$remote_token" || true; fi
          }
          cleanup_on_exit() {
            local cleanup_status=$?
            trap - EXIT INT TERM HUP
            cleanup_staged_secrets
            exit "$cleanup_status"
          }
          cleanup_on_signal() {
            local cleanup_status="$1"
            trap - EXIT INT TERM HUP
            cleanup_staged_secrets
            exit "$cleanup_status"
          }
          trap cleanup_on_exit EXIT
          trap 'cleanup_on_signal 130' INT
          trap 'cleanup_on_signal 143' TERM
          trap 'cleanup_on_signal 129' HUP
          remote_env=$(umask 077; mktemp /tmp/letletme-graphql-env.XXXXXX)
          remote_token=$(umask 077; mktemp /tmp/letletme-graphql-token.XXXXXX)
          IFS= read -r env_marker
          test "$env_marker" = "__LETLETME_GRAPHQL_ENV_B64__"
          IFS= read -r env_payload
          test -n "$env_payload"
          if ! printf '%s' "$env_payload" | base64 --decode > "$remote_env"; then
            echo "GraphQL environment payload failed remote base64 decode" >&2
            exit 1
          fi
          IFS= read -r token_marker
          test "$token_marker" = "__LETLETME_GHCR_TOKEN_B64__"
          IFS= read -r token_payload
          test -n "$token_payload"
          if ! printf '%s' "$token_payload" | base64 --decode > "$remote_token"; then
            echo "GHCR token payload failed remote base64 decode" >&2
            exit 1
          fi
          chmod 600 "$remote_env" "$remote_token"
          export GRAPHQL_ENV_FILE="$remote_env"
          export GHCR_TOKEN_FILE="$remote_token"
          bash -s
          REMOTE_WRAPPER
            printf '%s\n' "__LETLETME_GRAPHQL_ENV_B64__"
            printf '%s\n' "$env_b64"
            printf '%s\n' "__LETLETME_GHCR_TOKEN_B64__"
            printf '%s\n' "$token_b64"
            cat scripts/deploy-remote.sh
          } | ssh "${ssh_common[@]}" "$target" \
            "DEPLOY_SHA=$deploy_sha_q IMAGE_REF=$image_ref_q GHCR_USER=$ghcr_user_q VPS_WORKDIR=$workdir_q ACTIVE_SLOT_FILE=$active_file_q SWITCH_HELPER=$helper_q PUBLIC_GRAPHQL_HEALTH_URL=$public_health_q PUBLIC_GRAPHQL_URL=$public_graphql_q RATE_LIMIT_ROLLOUT=$rollout_q bash -s"

      - name: Promote verified digest to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${{ steps.image.outputs.image_ref }}"

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SSH_DIR:-}" ] && [ -d "$SSH_DIR" ]; then
            rm -f -- "$SSH_DIR/id_ed25519" "$SSH_DIR/known_hosts"
            rmdir -- "$SSH_DIR" || true
          fi
