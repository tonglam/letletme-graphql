name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rate_limit_rollout:
        description: Persisted GraphQL rate-limit rollout profile
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - p0-legacy
          - shadow-v3
          - enforce-v3
          - enforce-v3-restored-compat
          - rollback-legacy
          - secret
      my_fpl_snapshot_read:
        description: My FPL immutable daily snapshot read flag
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Resolve protected main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          workflow_sha="${WORKFLOW_SHA:-}"
          test -z "$workflow_sha" || test "$main_sha" = "$workflow_sha"
          ci_run_id=""
          if [ -z "$workflow_sha" ]; then
            runs_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=20")
            ci_run_id=$(printf '%s' "$runs_json" | jq -r --arg sha "$main_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.id) | last | .id // empty')
            test -n "$ci_run_id" || {
              echo "No completed successful ci.yml push run found for exact main SHA $main_sha"
              exit 1
            }
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${digest}"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Scan immutable image before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Promote scanned digest to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${{ steps.image.outputs.image_ref }}"

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          GRAPHQL_ENV: ${{ secrets.GRAPHQL_ENV }}
          RATE_LIMIT_ROLLOUT: ${{ inputs.rate_limit_rollout || 'preserve' }}
          MY_FPL_SNAPSHOT_READ: ${{ inputs.my_fpl_snapshot_read || 'preserve' }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,GRAPHQL_ENV,RATE_LIMIT_ROLLOUT,MY_FPL_SNAPSHOT_READ
          script: |
            set -euo pipefail
            platform_deploy_lock_path=${DEPLOY_LOCK_PATH:-/var/lock/letletme-platform-deploy.lock}
            mkdir -p "$(dirname "$platform_deploy_lock_path")"
            exec 9>"$platform_deploy_lock_path"
            flock -n 9 || {
              echo "platform deploy lock is already held: $platform_deploy_lock_path" >&2
              exit 1
            }
            release_platform_deploy_lock() {
              flock -u 9 || true
              exec 9>&- || true
            }
            deployment_started=false
            deployment_committed=false
            env_promoted=false
            previous_env=""
            deployment_state="$HOME/.letletme-graphql-current-deployment.json"
            deployment_state_next=""
            rollout_state=""
            rollout_state_backup=""
            rollout_state_existed=false
            snapshot_read_state=""
            snapshot_read_state_backup=""
            snapshot_read_state_existed=false
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            active_stage=""
            stage_started_at=0
            start_stage() {
              active_stage="$1"
              stage_started_at=$(date +%s%3N)
            }
            finish_stage() {
              finished_at=$(date +%s%3N)
              duration_ms=$(( finished_at - stage_started_at ))
              printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"passed","durationMs":%s}\n' \
                "$active_stage" "$duration_ms"
              active_stage=""
            }
            fail_without_rollback_on_exit() {
              original_status=$?
              trap - EXIT
              set +e
              if [ "$original_status" -ne 0 ] && [ -n "$active_stage" ]; then
                failed_at=$(date +%s%3N)
                failed_duration_ms=$(( failed_at - stage_started_at ))
                printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"failed","durationMs":%s}\n' \
                  "$active_stage" "$failed_duration_ms"
              fi
              if [ -n "${next_env:-}" ]; then
                rm -f "$next_env"
              fi
              if [ -n "${previous_env:-}" ]; then
                rm -f "$previous_env"
              fi
              if [ -n "${deployment_state_next:-}" ]; then
                rm -f "$deployment_state_next"
              fi
              if [ -n "${rollout_state_backup:-}" ]; then
                rm -f "$rollout_state_backup"
              fi
              if [ -n "${snapshot_read_state_backup:-}" ]; then
                rm -f "$snapshot_read_state_backup"
              fi
              release_platform_deploy_lock
              exit "$original_status"
            }
            trap fail_without_rollback_on_exit EXIT
            image_name=${IMAGE_REF%@*}
            [[ "$image_name" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
            case "$VPS_WORKDIR" in
              /*) ;;
              *) echo "VPS_WORKDIR must be an absolute path"; exit 1 ;;
            esac
            test "$VPS_WORKDIR" != "/"

            start_stage checkout
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin

            if [ ! -d "$VPS_WORKDIR/.git" ]; then
              if [ -d "$VPS_WORKDIR" ] && [ -n "$(find "$VPS_WORKDIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                echo "GraphQL VPS workdir exists but is not an empty Git checkout"
                exit 1
              fi
              mkdir -p "$(dirname "$VPS_WORKDIR")"
              git clone https://github.com/tonglam/letletme-graphql.git "$VPS_WORKDIR"
            fi

            cd "$VPS_WORKDIR"
            git diff --quiet || { echo "GraphQL VPS checkout has tracked modifications"; exit 1; }
            git diff --cached --quiet || { echo "GraphQL VPS index has staged modifications"; exit 1; }
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            finish_stage

            start_stage envValidate
            umask 077
            next_env=$(mktemp "$VPS_WORKDIR/.env.deploy.next.XXXXXX")
            printf '%s' "$GRAPHQL_ENV" > "$next_env"
            chmod 600 "$next_env"
            rollout_state="$HOME/.letletme-graphql-rate-limit-rollout"
            if [ -f "$rollout_state" ]; then
              rollout_state_existed=true
              rollout_state_backup=$(mktemp "$HOME/.letletme-graphql-rate-limit-rollout.previous.XXXXXX")
              cp "$rollout_state" "$rollout_state_backup"
              chmod 600 "$rollout_state_backup"
            fi
            persist_rate_limit_rollout=""
            case "$RATE_LIMIT_ROLLOUT" in
              preserve)
                if [ -f "$rollout_state" ]; then
                  active_rate_limit_rollout=$(cat "$rollout_state")
                else
                  active_rate_limit_rollout=secret
                fi
                ;;
              p0-legacy|shadow-v3|enforce-v3|enforce-v3-restored-compat|rollback-legacy)
                active_rate_limit_rollout="$RATE_LIMIT_ROLLOUT"
                persist_rate_limit_rollout="$active_rate_limit_rollout"
                ;;
              secret)
                active_rate_limit_rollout=secret
                persist_rate_limit_rollout=secret
                ;;
              *)
                echo "Unknown rate-limit rollout profile"
                exit 1
                ;;
            esac
            snapshot_read_state="$HOME/.letletme-graphql-my-fpl-snapshot-read"
            if [ -f "$snapshot_read_state" ]; then
              snapshot_read_state_existed=true
              snapshot_read_state_backup=$(mktemp "$HOME/.letletme-graphql-my-fpl-snapshot-read.previous.XXXXXX")
              cp "$snapshot_read_state" "$snapshot_read_state_backup"
              chmod 600 "$snapshot_read_state_backup"
            fi
            persist_snapshot_read=""
            case "$MY_FPL_SNAPSHOT_READ" in
              preserve)
                if [ -f "$snapshot_read_state" ]; then
                  active_snapshot_read=$(cat "$snapshot_read_state")
                else
                  active_snapshot_read=false
                fi
                ;;
              enable)
                active_snapshot_read=true
                persist_snapshot_read=true
                ;;
              disable)
                active_snapshot_read=false
                persist_snapshot_read=false
                ;;
              *)
                echo "Unknown My FPL snapshot read flag"
                exit 1
                ;;
            esac
            case "$active_snapshot_read" in
              true|false) ;;
              *) echo "Invalid persisted My FPL snapshot read state"; exit 1 ;;
            esac
            python3 - "$next_env" "$active_rate_limit_rollout" "$active_snapshot_read" <<'PY'
            import re
            import sys
            from pathlib import Path
            from urllib.parse import unquote, urlsplit

            env_path = Path(sys.argv[1])
            rollout = sys.argv[2]
            snapshot_read_enabled = sys.argv[3]
            lines = env_path.read_text(encoding="utf-8").splitlines()

            profiles = {
                "p0-legacy": ("legacy", "960", "900", "1200"),
                "shadow-v3": ("shadow-v3", "960", "900", "1200"),
                "enforce-v3": ("enforce-v3", "960", "900", "1200"),
                "enforce-v3-restored-compat": ("enforce-v3", "480", "900", "600"),
                "rollback-legacy": ("legacy", "480", "900", "600"),
            }
            if rollout != "secret":
                if rollout not in profiles:
                    raise SystemExit("Unsupported persisted rate-limit rollout profile")
                mode, browser, authenticated, anonymous = profiles[rollout]
                replacements = {
                    "GRAPHQL_RATE_LIMIT_MODE": mode,
                    "GRAPHQL_BROWSER_INGRESS_RATE_LIMIT": browser,
                    "GRAPHQL_AUTHENTICATED_RATE_LIMIT": authenticated,
                    "GRAPHQL_ANONYMOUS_RATE_LIMIT": anonymous,
                }
                lines = [
                    line
                    for line in lines
                    if line.split("=", 1)[0] not in replacements
                ]
                lines.extend(f"{key}={value}" for key, value in replacements.items())

            if snapshot_read_enabled not in ("true", "false"):
                raise SystemExit("Unsupported persisted My FPL snapshot read state")
            lines = [
                line
                for line in lines
                if line.split("=", 1)[0] != "MY_FPL_SNAPSHOT_READ_ENABLED"
            ]
            lines.append("MY_FPL_SNAPSHOT_READ_ENABLED=" + snapshot_read_enabled)
            env_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

            database_url_indexes = [
                index for index, line in enumerate(lines) if line.startswith("DATABASE_URL=")
            ]
            if len(database_url_indexes) != 1:
                raise SystemExit("GRAPHQL_ENV must contain exactly one DATABASE_URL")

            index = database_url_indexes[0]
            raw_value = lines[index].split("=", 1)[1]
            value = raw_value
            if len(raw_value) >= 2 and raw_value[0] == raw_value[-1] and raw_value[0] in ("'", '"'):
                value = raw_value[1:-1]

            parsed = urlsplit(value)
            username = unquote(parsed.username or "")
            hostname = (parsed.hostname or "").lower()
            if parsed.scheme not in ("postgres", "postgresql"):
                raise SystemExit("DATABASE_URL must use the postgres or postgresql scheme")
            pooler_role = (
                re.fullmatch(r"[^.]+\.pooler\.supabase\.com", hostname)
                and re.fullmatch(r"letletme_graphql_runtime\.[^.]+", username)
            )
            if username != "letletme_graphql_runtime" and not pooler_role:
                raise SystemExit("DATABASE_URL must use letletme_graphql_runtime")
            if not hostname:
                raise SystemExit("DATABASE_URL must include a host")
            if not parsed.password:
                raise SystemExit("DATABASE_URL must include the GraphQL runtime credential")
            PY
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config --quiet
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config | grep -q 'max-size: 20m'
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose config | grep -Eq 'max-file: "5"$'
            if [ -f .env.deploy ]; then
              previous_env=$(mktemp "$VPS_WORKDIR/.env.deploy.previous.XXXXXX")
              cp .env.deploy "$previous_env"
              chmod 600 "$previous_env"
            fi
            finish_stage

            old_container=$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
              docker compose ps --all -q graphql | head -n 1)
            old_image=""
            if [ -n "$old_container" ]; then
              old_image=$(docker inspect --format '{{.Config.Image}}' "$old_container")
              test -n "$old_image"
              docker image inspect "$old_image" >/dev/null
            fi

            running_deploy_sha=""
            if [ -n "$old_container" ] && [ -f "$deployment_state" ]; then
              state_sha=$(jq -r '.deploySha // empty' "$deployment_state" 2>/dev/null || true)
              state_image=$(jq -r '.image // empty' "$deployment_state" 2>/dev/null || true)
              if [[ "$state_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$state_image" = "$old_image" ]; then
                running_deploy_sha="$state_sha"
              elif [ "$RATE_LIMIT_ROLLOUT" = p0-legacy ]; then
                echo "Stored GraphQL deployment identity does not match the running image"
                exit 1
              fi
            fi

            if [ "$RATE_LIMIT_ROLLOUT" = p0-legacy ]; then
              test -n "$old_container"
              [[ "$old_image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
              [[ "$running_deploy_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "P0 requires a persisted SHA bound to the running GraphQL image"
                exit 1
              }
              backup_root="$HOME/.letletme-graphql-rollbacks"
              install -m 700 -d "$backup_root"
              backup_stamp=$(date -u +%Y%m%dT%H%M%SZ)
              backup_dir="$backup_root/pre-p0-$backup_stamp"
              install -m 700 -d "$backup_dir"
              if [ -f .env.deploy ]; then
                cp .env.deploy "$backup_dir/env.deploy"
                chmod 600 "$backup_dir/env.deploy"
              fi
              curl --fail --silent http://127.0.0.1:4000/health > "$backup_dir/health.json"
              if [ -n "$old_container" ]; then
                docker stats --no-stream --format '{{json .}}' "$old_container" \
                  > "$backup_dir/docker-stats.json"
                APP_ENV_FILE=.env.deploy APP_IMAGE="$old_image" \
                  docker compose exec -T graphql bun -e '
                    const token = process.env.METRICS_TOKEN;
                    const response = await fetch("http://127.0.0.1:4000/metrics", {
                      headers: { "X-Metrics-Token": token },
                    });
                    if (!response.ok) throw new Error("metrics baseline failed");
                    process.stdout.write(await response.text());
                  ' > "$backup_dir/metrics.prom"
                docker cp scripts/rate-limit-p0-probe.ts \
                  "$old_container:/tmp/rate-limit-p0-probe.ts"
                docker exec \
                  -e P0_PROBE_REQUESTS=700 \
                  -e P0_PROBE_SUBJECT="before-$backup_stamp" \
                  "$old_container" bun /tmp/rate-limit-p0-probe.ts \
                  > "$backup_dir/probe-before.json"
                jq -e \
                  '.total == 700 and .successful > 0 and .rateLimited > 0 and .unexpected == 0 and (.successful + .rateLimited == .total)' \
                  "$backup_dir/probe-before.json" \
                  >/dev/null
              fi
              jq -n \
                --arg capturedAt "$backup_stamp" \
                --arg deploySha "$running_deploy_sha" \
                --arg image "$old_image" \
                '{capturedAt: $capturedAt, deploySha: $deploySha, image: $image}' \
                > "$backup_dir/manifest.json"
              chmod 600 "$backup_dir/health.json" "$backup_dir/docker-stats.json" \
                "$backup_dir/metrics.prom" "$backup_dir/probe-before.json" \
                "$backup_dir/manifest.json" 2>/dev/null || true
              printf '%s\n' "$backup_dir" > "$HOME/.letletme-graphql-pre-p0-latest"
              chmod 600 "$HOME/.letletme-graphql-pre-p0-latest"
            fi

            deployment_started=true

            start_stage pull
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose pull graphql
            finish_stage
            start_stage preflight
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
              docker compose run --rm -T graphql bun run contract:check
            finish_stage

            start_stage redisPreflight
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
              docker compose run --rm -T --no-deps graphql bun run redis:check
            finish_stage

            rollback_armed=false
            rollback_graphql_on_exit() {
              original_status=$?
              trap - EXIT
              set +e
              if [ "$original_status" -ne 0 ] && [ -n "$active_stage" ]; then
                failed_at=$(date +%s%3N)
                failed_duration_ms=$(( failed_at - stage_started_at ))
                printf '{"event":"deploy_stage_timing","service":"graphql","stage":"%s","outcome":"failed","durationMs":%s}\n' \
                  "$active_stage" "$failed_duration_ms"
                active_stage=""
              fi
              if [ "$rollback_armed" = true ] && [ "$deployment_committed" = false ]; then
                if [ -n "$old_image" ]; then
                  echo "GraphQL deployment failed; restoring the previous image"
                  rollback_env="$next_env"
                  if [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                    mv "$previous_env" .env.deploy
                    chmod 600 .env.deploy
                    rollback_env=.env.deploy
                  elif [ "$env_promoted" = true ] && [ -f .env.deploy ]; then
                    rollback_env=.env.deploy
                  fi
                  APP_ENV_FILE="$rollback_env" APP_IMAGE="$old_image" docker compose up \
                    -d --no-deps --no-build --force-recreate graphql
                  rollback_restored=false
                  for rollback_attempt in $(seq 1 30); do
                    if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                      rollback_restored=true
                      break
                    fi
                    sleep 2
                  done
                  if [ "$rollback_restored" = true ]; then
                    echo "GraphQL rollback restored the previous image"
                  else
                    echo "GraphQL rollback failed to restore a healthy service"
                    APP_ENV_FILE="$rollback_env" APP_IMAGE="$old_image" \
                      docker compose logs --tail 100 graphql || true
                  fi
                else
                  echo "GraphQL deployment failed without a previous image; removing the failed container"
                  rollback_cleanup_env="$next_env"
                  if [ "$env_promoted" = true ]; then
                    if [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                      mv "$previous_env" .env.deploy
                      chmod 600 .env.deploy
                      rollback_cleanup_env=.env.deploy
                    elif [ -f .env.deploy ]; then
                      rollback_cleanup_env=.env.deploy
                    fi
                  fi
                  APP_ENV_FILE="$rollback_cleanup_env" APP_IMAGE="$IMAGE_REF" \
                    docker compose rm --stop --force graphql || true
                fi
                if [ "$rollout_state_existed" = true ]; then
                  if [ -n "$rollout_state_backup" ] && [ -f "$rollout_state_backup" ]; then
                    mv "$rollout_state_backup" "$rollout_state"
                    chmod 600 "$rollout_state"
                    rollout_state_backup=""
                  else
                    echo "GraphQL rollback could not restore the previous rate-limit rollout state"
                  fi
                else
                  rm -f "$rollout_state"
                fi
                if [ "$snapshot_read_state_existed" = true ]; then
                  if [ -n "$snapshot_read_state_backup" ] && [ -f "$snapshot_read_state_backup" ]; then
                    mv "$snapshot_read_state_backup" "$snapshot_read_state"
                    chmod 600 "$snapshot_read_state"
                    snapshot_read_state_backup=""
                  else
                    echo "GraphQL rollback could not restore the previous My FPL snapshot read state"
                  fi
                else
                  rm -f "$snapshot_read_state"
                fi
              fi
              if [ "$env_promoted" = false ] && [ -n "${previous_env:-}" ] && [ -f "$previous_env" ]; then
                rm -f "$previous_env"
              fi
              if [ -n "${deployment_state_next:-}" ]; then
                rm -f "$deployment_state_next"
              fi
              rm -f "$next_env"
              release_platform_deploy_lock
              exit "$original_status"
            }
            trap rollback_graphql_on_exit EXIT
            rollback_armed=true

            start_stage replace
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose stop -t 30 graphql
            test -z "$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps -q graphql)"
            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose up \
              -d --remove-orphans --no-build --force-recreate graphql
            finish_stage

            start_stage serviceReady
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
                  docker compose logs --tail 100 graphql || true
                exit 1
              fi
              sleep 2
            done
            finish_stage

            start_stage smoke
            anonymous_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{"query":"query { currentEventInfo { season } }"}' \
              http://127.0.0.1:4000/graphql)
            test "$anonymous_status" = '401'

            APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose exec -T graphql bun -e '
              const token = process.env.GRAPHQL_SERVICE_TOKEN;
              if (!token) throw new Error("Missing GRAPHQL_SERVICE_TOKEN");
              const request = async (query, variables = {}) => {
                const response = await fetch("http://127.0.0.1:4000/graphql", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "X-GraphQL-Service-Token": token,
                  },
                  body: JSON.stringify({ query, variables }),
                });
                const payload = await response.json();
                if (response.status !== 200 || payload.errors) {
                  throw new Error("GraphQL deployment smoke failed: " + JSON.stringify(payload.errors));
                }
                return payload.data;
              };
              const data = await request(`query DeploymentSmoke {
                currentEventInfo { season currentEvent nextEvent }
                players(limit: 1) { id webName price }
              }`);
              const info = data?.currentEventInfo;
              if (
                !/^[0-9]{4}$/.test(info?.season ?? "") ||
                !Array.isArray(data?.players) ||
                data.players.length !== 1
              ) {
                throw new Error("GraphQL deployment core contract failed");
              }
              const live = await request(`query LiveDeploymentSmoke {
                liveContext {
                  season coreRevision currentEventId nextEventId liveRevision state stale
                }
              }`);
              const context = live?.liveContext;
              if (
                context?.season !== info.season ||
                typeof context.coreRevision !== "string" ||
                !context.coreRevision ||
                typeof context.state !== "string" ||
                typeof context.stale !== "boolean"
              ) {
                throw new Error("GraphQL deployment live context contract failed");
              }
              const eventId =
                Number.isInteger(context.currentEventId) && context.currentEventId > 0
                  ? context.currentEventId
                  : Number.isInteger(context.nextEventId) && context.nextEventId > 0
                    ? context.nextEventId
                    : null;
              if (context.liveRevision !== null && (!eventId || typeof context.liveRevision !== "string")) {
                throw new Error("GraphQL deployment live revision contract failed");
              }
              console.log(JSON.stringify({
                status: "graphql_deployment_contract_passed",
                season: info.season,
                eventId,
                liveState: context.state,
                liveRevision: context.liveRevision,
              }));
            '

            container=$(APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" docker compose ps -q graphql)
            test -n "$container"
            test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$IMAGE_REF"
            for attempt in $(seq 1 20); do
              container_health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              if [ "$container_health" = 'healthy' ]; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "GraphQL container health did not settle: $container_health"
                APP_ENV_FILE="$next_env" APP_IMAGE="$IMAGE_REF" \
                  docker compose logs --tail 100 graphql || true
                exit 1
              fi
              sleep 3
            done
            finish_stage

            if [ "$RATE_LIMIT_ROLLOUT" = p0-legacy ]; then
              start_stage p0Observe
              observation_dir="$backup_dir/observation"
              install -m 700 -d "$observation_dir"
              docker cp scripts/rate-limit-p0-probe.ts \
                "$container:/tmp/rate-limit-p0-probe.ts"
              docker exec \
                -e P0_PROBE_REQUESTS=700 \
                -e P0_PROBE_SUBJECT="after-$backup_stamp" \
                "$container" bun /tmp/rate-limit-p0-probe.ts \
                > "$observation_dir/probe-after.json"
              before_429=$(jq -r '.rateLimited' "$backup_dir/probe-before.json")
              after_429=$(jq -r '.rateLimited' "$observation_dir/probe-after.json")
              jq -e \
                '.total == 700 and .successful > 0 and .unexpected == 0 and (.successful + .rateLimited == .total)' \
                "$observation_dir/probe-after.json" \
                >/dev/null
              test "$before_429" -gt 0
              if [ $(( after_429 * 2 )) -gt "$before_429" ]; then
                echo "P0 regression 429s did not fall by at least 50%: $before_429 -> $after_429"
                exit 1
              fi

              capture_candidate_metrics() {
                docker exec "$container" bun -e '
                  const token = process.env.METRICS_TOKEN;
                  const response = await fetch("http://127.0.0.1:4000/metrics", {
                    headers: { "X-Metrics-Token": token },
                  });
                  if (!response.ok) throw new Error("metrics observation failed");
                  process.stdout.write(await response.text());
                '
              }
              capture_candidate_metrics > "$observation_dir/previous.prom"
              printf '%s\n' \
                '{"badGraphqlErrors":0,"dbWaiting":0,"cpu":0,"memory":0,"samples":0}' \
                > "$observation_dir/state.json"
              : > "$observation_dir/samples.jsonl"
              for sample in $(seq 1 60); do
                sleep 30
                health_status=$(curl --silent --show-error \
                  --output "$observation_dir/health.json" \
                  --write-out '%{http_code}' \
                  http://127.0.0.1:4000/health || true)
                capture_candidate_metrics > "$observation_dir/current.prom"
                docker stats --no-stream --format '{{json .}}' "$container" \
                  > "$observation_dir/stats.json"
                if ! python3 scripts/rate_limit_p0_guard.py \
                  --baseline "$backup_dir/metrics.prom" \
                  --previous "$observation_dir/previous.prom" \
                  --current "$observation_dir/current.prom" \
                  --stats "$observation_dir/stats.json" \
                  --state "$observation_dir/state.json" \
                  --output "$observation_dir/next-state.json" \
                  --health-status "${health_status:-0}"; then
                  cat "$observation_dir/next-state.json"
                  exit 1
                fi
                mv "$observation_dir/next-state.json" "$observation_dir/state.json"
                cat "$observation_dir/state.json" >> "$observation_dir/samples.jsonl"
                cp "$observation_dir/current.prom" "$observation_dir/previous.prom"
              done
              chmod -R go-rwx "$backup_dir"
              finish_stage
            fi

            start_stage finalize
            mv "$next_env" .env.deploy
            chmod 600 .env.deploy
            env_promoted=true
            if [ -n "$persist_rate_limit_rollout" ]; then
              if [ "$persist_rate_limit_rollout" = secret ]; then
                rm -f "$rollout_state"
              else
                printf '%s\n' "$persist_rate_limit_rollout" > "$rollout_state"
                chmod 600 "$rollout_state"
              fi
            fi
            if [ -n "$persist_snapshot_read" ]; then
              printf '%s\n' "$persist_snapshot_read" > "$snapshot_read_state"
              chmod 600 "$snapshot_read_state"
            fi

            if [ -n "$old_image" ]; then
              printf '%s\n' "$old_image" > "$HOME/.letletme-graphql-previous-image"
              chmod 600 "$HOME/.letletme-graphql-previous-image"
            fi
            deployment_state_next=$(mktemp "$HOME/.letletme-graphql-current-deployment.next.XXXXXX")
            jq -n \
              --arg deployedAt "$(date -u +%Y%m%dT%H%M%SZ)" \
              --arg deploySha "$DEPLOY_SHA" \
              --arg image "$IMAGE_REF" \
              '{deployedAt: $deployedAt, deploySha: $deploySha, image: $image}' \
              > "$deployment_state_next"
            chmod 600 "$deployment_state_next"
            mv "$deployment_state_next" "$deployment_state"
            deployment_state_next=""
            deployment_committed=true
            finish_stage
            rollback_armed=false
            trap - EXIT
            if [ -n "$rollout_state_backup" ]; then
              rm -f "$rollout_state_backup"
              rollout_state_backup=""
            fi
            if [ -n "$snapshot_read_state_backup" ]; then
              rm -f "$snapshot_read_state_backup"
              snapshot_read_state_backup=""
            fi
            if [ -n "$previous_env" ]; then
              rm -f "$previous_env"
            fi
            previous_image=""
            if [ -f "$HOME/.letletme-graphql-previous-image" ]; then
              previous_image=$(cat "$HOME/.letletme-graphql-previous-image")
            fi
            scoped_repo_digests=$(docker image ls --digests --format '{{.Repository}}@{{.Digest}}' \
              --filter "reference=${image_name}@sha256:*" | sort -u)
            while IFS= read -r digest_ref; do
              if [ -z "$digest_ref" ] || [ "$digest_ref" = "$IMAGE_REF" ] || [ "$digest_ref" = "$previous_image" ]; then
                continue
              fi
              docker image rm "$digest_ref" || echo "unable to remove obsolete image reference: $digest_ref" >&2
            done <<< "$scoped_repo_digests"
            scoped_dangling_images=$(docker image ls --quiet \
              --filter "reference=${image_name}:*" \
              --filter dangling=true | sort -u)
            while IFS= read -r dangling_image; do
              if [ -n "$dangling_image" ]; then
                docker image rm "$dangling_image"
              fi
            done <<< "$scoped_dangling_images"
            docker system df || true
            if [ -n "$old_image" ]; then
              docker image inspect "$old_image" >/dev/null
            fi
            APP_IMAGE="$IMAGE_REF" docker compose ps graphql
