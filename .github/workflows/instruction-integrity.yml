name: instruction-integrity

on:
  # pull_request is an always-running, secret-free bootstrap. It is not the
  # required gate: the trusted pull_request_target job below publishes the
  # required check from base-branch workflow code. Keeping this bootstrap is
  # useful for the first installation, before the base branch has the trusted
  # workflow and validator.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The base-branch workflow is trusted; the proposed checkout is data only.
  # Label changes must re-evaluate the exact labeled head, and removing the
  # label must revoke the transition immediately.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  # pull_request_target exposes the base ref as github.ref; use the PR number
  # so one PR cannot cancel another. Push runs remain grouped by branch.
  # Target actions for one PR share a group, while the secret-free bootstrap
  # remains independent so it cannot cancel the trusted gate. Removing
  # approval still cancels an in-flight labeled target run instead of allowing
  # it to publish late.
  group: instruction-integrity-${{ github.repository }}-${{ github.event.pull_request.number || format('push-{0}', github.ref_name) }}-${{ github.event_name == 'pull_request' && 'bootstrap' || 'trusted' }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name == 'pull_request'
    name: instruction-integrity-bootstrap
    env:
      GOVERNANCE_UPDATE_APPROVED: ${{ github.event.action == 'labeled' && github.event.label.name == 'instruction-governance-approved' && github.event.sender.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout proposed tree (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Checkout trusted base contract (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Require the governance scaffold
        run: |
          for file in AGENTS.md .codex/global-skills.json .codex/instruction-integrity.json .codex/validate_instructions.py .codex/provision_global_skills.py .codex/instruction-policy.v1.json .github/workflows/instruction-integrity.yml; do
            test -s "target/$file" && test ! -L "target/$file"
          done
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('target')
          def fail(message):
              raise SystemExit(message)

          def load_object(relative):
              try:
                  value = json.loads((root / relative).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError) as error:
                  fail(f'{relative}: invalid JSON: {error}')
              if not isinstance(value, dict):
                  fail(f'{relative}: expected a JSON object')
              return value

          contract = load_object('.codex/instruction-integrity.json')
          if contract.get('version') != 1:
              fail('contract version must be 1')
          for key in ('required_agents', 'required_skills', 'required_global_skills'):
              value = contract.get(key)
              if not isinstance(value, list) or not value or not all(isinstance(item, str) and item.strip() for item in value):
                  fail(f'contract {key} must be a non-empty string list')
              if len(set(value)) != len(value):
                  fail(f'contract {key} must not contain duplicates')
          if not re.fullmatch(r'[0-9a-fA-F]{7,40}', str(contract.get('canonical_config_commit', ''))):
              fail('contract canonical_config_commit must be a hexadecimal revision')
          policy = load_object('.codex/instruction-policy.v1.json')
          rules = policy.get('review_rules')
          required_rules = {'codex_quota', 'tests_and_scripts', 'all_other_paths', 'all_findings', 'post_merge_cleanup'}
          if policy.get('version') != 1 or not isinstance(rules, dict) or set(rules) != required_rules:
              fail('policy must contain version 1 and every review rule')
          if 'tests' not in rules['tests_and_scripts'] or 'scripts' not in rules['tests_and_scripts']:
              fail('policy must preserve the tests/scripts exception')
          if 'P2' not in rules['all_other_paths'] or 'P3' not in rules['all_other_paths']:
              fail('policy must require non-test P2/P3 fixes')
          manifest = load_object('.codex/global-skills.json')
          registry = manifest.get('registry')
          if manifest.get('version') != 1 or not isinstance(registry, dict) or not re.fullmatch(r'[0-9a-f]{40}', str(registry.get('ref', ''))) or not re.fullmatch(r'[0-9a-f]{64}', str(registry.get('sha256', ''))):
              fail('global manifest must pin a full commit and content digest')
          if not isinstance(manifest.get('skills'), list) or len(set(manifest['skills'])) != len(manifest['skills']) or set(manifest['skills']) != set(contract['required_global_skills']):
              fail('global manifest skill list must match the contract')
          agents = ' '.join((root / 'AGENTS.md').read_text(encoding='utf-8').casefold().split())
          required_clauses = (
              'review may be skipped only after two consecutive explicit quota-limit responses',
              'every p0-p3 finding must be dispositioned and its thread resolved',
              'only a finding confined to tests/scripts gets the time exception',
              'p2/p3 anywhere else must be actually fixed and verified',
              'merge is prohibited while any finding is undispositioned or any review thread is unresolved',
              'after merge, clean only the exact corresponding worktree, local branch, and remote branch',
          )
          if len(agents) < 200 or not all(clause in agents for clause in required_clauses):
              fail('AGENTS.md is missing the operative governance clauses')
          for raw in contract['required_agents']:
              path = root / raw
              if not path.is_file() or path.is_symlink() or not path.read_text(encoding='utf-8').strip():
                  fail(f'required AGENTS file is missing, empty, or symlinked: {raw}')
          for raw in contract['required_skills']:
              path = root / raw
              entry = path if path.name == 'SKILL.md' else path / 'SKILL.md'
              if not path.is_dir() or not entry.is_file() or entry.is_symlink():
                  fail(f'required skill entrypoint is missing, not a directory, or symlinked: {raw}')
              text = entry.read_text(encoding='utf-8')
              if not re.match(r'\A---\s*\n', text) or not re.search(r'(?m)^name:\s*\S+', text) or not re.search(r'(?m)^description:\s*\S+', text) or not text.split('---', 2)[-1].strip():
                  fail(f'skill entrypoint has invalid frontmatter or no body: {raw}')
          print('bootstrap structural and governance checks passed')
          PY
      - name: Validate pull request head with trusted validator
        run: |
          # The first landing may predate the repository validator. Once the
          # base contains it, run that immutable copy against the PR head; the
          # structural scaffold check above remains mandatory in either case.
          if test -f trusted/.codex/validate_instructions.py && \
             test -f trusted/.codex/instruction-integrity.json && \
             test -f trusted/.codex/instruction-policy.v1.json; then
            extra_args=()
            if test "$GOVERNANCE_UPDATE_APPROVED" = true; then
              extra_args+=(--allow-config-commit-update)
            fi
            python3 trusted/.codex/validate_instructions.py "${extra_args[@]}" \
              --repo target \
              --contract target/.codex/instruction-integrity.json \
              --policy target/.codex/instruction-policy.v1.json \
              --trusted-contract trusted/.codex/instruction-integrity.json \
              --trusted-policy trusted/.codex/instruction-policy.v1.json
          else
            echo 'initial governance installation: trusted validator is not present on the base; structural bootstrap completed'
          fi
  validate:
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    name: instruction-integrity
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Approval is valid only for the labeled event's exact head. A later
      # synchronize event is unapproved until the maintainer labels that new
      # head again, so a persistent label cannot authorize unseen commits.
      GOVERNANCE_UPDATE_APPROVED: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'instruction-governance-approved' && contains(github.event.pull_request.labels.*.name, 'instruction-governance-approved') && github.event.sender.login == github.repository_owner }}
    steps:
      - name: Invalidate prior head-associated instruction-integrity check
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          case "$HEAD_SHA" in
            ''|*[!0-9a-f]*)
              echo 'pull request head is not a full lowercase commit SHA' >&2
              exit 1
              ;;
          esac
          check_run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=instruction-integrity&per_page=100" \
            --jq '[.check_runs[] | select(.name == "instruction-integrity") | .id] | first // empty')"
          if test -n "$check_run_id"; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
              --raw-field status=in_progress \
              --raw-field started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          else
            echo 'no prior instruction-integrity check to invalidate'
          fi
      - name: Checkout proposed tree (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false
      - name: Checkout trusted base contract and validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      # Materialize the immutable registry before any proposed instruction
      # filesystem is inspected. The validator below consumes this checkout;
      # it is never allowed to trust a registry file supplied by the PR.
      - name: Verify pinned global registry contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          manifest="target/.codex/global-skills.json"
          GOVERNANCE_UPDATE_APPROVED="$GOVERNANCE_UPDATE_APPROVED" python3 - "$manifest" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          descriptor = manifest.get("registry")
          expected = {
              "repository": "tonglam/codex-workspace-config",
              "ref": "7e92336ec04d38f7bb95620e304ce6ec6567c896",
              "path": "registry/workspace-assets.json",
              "sha256": "fa1a2a5448e34376c4dccfe43c6c8a901adb9b62df3995b1f11d3aa4b9b77cb6",
          }
          approved = os.environ.get("GOVERNANCE_UPDATE_APPROVED") == "true"
          target_contract = json.loads(Path("target/.codex/instruction-integrity.json").read_text(encoding="utf-8"))
          expected_source_revision = target_contract.get("canonical_config_commit") if approved else "312eaf56264f65bcc74fd7b81d8981a3517eca02"
          if not approved and descriptor != expected:
              raise SystemExit("global registry descriptor is not the trusted immutable pin")
          if approved:
              if not isinstance(descriptor, dict) or descriptor.get("repository") != expected["repository"] or descriptor.get("path") != expected["path"]:
                  raise SystemExit("approved registry transition must remain on the trusted workspace registry")
              if not isinstance(descriptor.get("ref"), str) or not re.fullmatch(r"[0-9a-f]{40}", descriptor["ref"]):
                  raise SystemExit("approved registry transition requires a full registry commit")
              if not isinstance(descriptor.get("sha256"), str) or not re.fullmatch(r"[0-9a-f]{64}", descriptor["sha256"]):
                  raise SystemExit("approved registry transition requires a 64-character content digest")
              if not isinstance(expected_source_revision, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_source_revision):
                  raise SystemExit("approved registry transition requires a full canonical source revision")
          checkout = Path("registry-source")
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("trusted registry checkout requires the GitHub token")
          authenticated_env = os.environ.copy()
          authenticated_env.update(
              {
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "http.extraheader",
                  "GIT_CONFIG_VALUE_0": f"Authorization: Bearer {token}",
              }
          )
          subprocess.run(
              ["git", "clone", "--filter=blob:none", "--no-checkout", "--depth=1", "--no-tags",
               f"https://github.com/{descriptor['repository']}.git", str(checkout)],
              check=True,
              stdout=subprocess.DEVNULL,
              env=authenticated_env,
          )
          subprocess.run(["git", "-C", str(checkout), "fetch", "--depth=1", "origin", descriptor["ref"]], check=True, stdout=subprocess.DEVNULL, env=authenticated_env)
          subprocess.run(["git", "-C", str(checkout), "checkout", "--detach", descriptor["ref"]], check=True, stdout=subprocess.DEVNULL, env=authenticated_env)
          if approved:
              subprocess.run(["git", "-C", str(checkout), "fetch", "--depth=1", "origin", expected_source_revision], check=True, stdout=subprocess.DEVNULL, env=authenticated_env)
          blob = subprocess.check_output(["git", "-C", str(checkout), "show", f"{descriptor['ref']}:{descriptor['path']}"], env=authenticated_env)
          if hashlib.sha256(blob).hexdigest() != descriptor["sha256"]:
              raise SystemExit("pinned registry content digest mismatch")
          source = json.loads(blob)
          if source.get("source", {}).get("revision") != expected_source_revision:
              raise SystemExit("pinned registry source revision is not the trusted canonical configuration")
          allowlist = source.get("governance", {}).get("global_skill_allowlist", [])
          names = {Path(item).name for item in allowlist if isinstance(item, str)}
          advertised = manifest.get("skills", [])
          missing = sorted(set(advertised) - names)
          if missing:
              raise SystemExit(f"pinned registry is missing advertised global skills: {', '.join(missing)}")
          missing_trees = []
          for name in advertised:
              skill = checkout / "global" / "skills" / name
              entry = skill / "SKILL.md"
              if skill.is_symlink() or entry.is_symlink() or not skill.is_dir() or not entry.is_file():
                  missing_trees.append(name)
              elif any(item.is_symlink() for item in skill.rglob("*")):
                  missing_trees.append(name)
              else:
                  try:
                      entry_text = entry.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError):
                      missing_trees.append(name)
                      continue
                  frontmatter = re.match(r"\A---\s*\n(.*?)\n---\s*(?:\n|\Z)", entry_text, flags=re.S)
                  if (
                      not frontmatter
                      or not re.search(r"(?m)^name:\s*\S+\s*$", frontmatter.group(1))
                      or not re.search(r"(?m)^description:\s*\S+\s*$", frontmatter.group(1))
                      or not entry_text[frontmatter.end() :].strip()
                  ):
                      missing_trees.append(name)
          if missing_trees:
              raise SystemExit(f"pinned registry is missing advertised skill trees: {', '.join(sorted(missing_trees))}")
          print("pinned global registry content verified")
          PY
      - name: Protect the integrity gate files
        run: |
          approved="$GOVERNANCE_UPDATE_APPROVED"
          for file in \
            .github/workflows/instruction-integrity.yml \
            .codex/validate_instructions.py \
            .codex/instruction-policy.v1.json \
            .codex/instruction-integrity.json \
            .codex/global-skills.json \
            .codex/provision_global_skills.py \
            skills-lock.json; do
            if test "$approved" != true; then
              if test -e "trusted/$file"; then
                test ! -L "trusted/$file"
                test -f "target/$file" && test ! -L "target/$file"
                cmp -s "trusted/$file" "target/$file" || {
                  echo "governance gate file changed: $file"
                  exit 1
                }
              elif test -e "target/$file"; then
                echo "governance gate file added: $file"
                exit 1
              fi
            else
              if test -e "target/$file"; then
                test -s "target/$file" && test ! -L "target/$file"
              fi
            fi
          done
          if test "$approved" = true; then
            python3 -m py_compile target/.codex/validate_instructions.py target/.codex/provision_global_skills.py
          fi
          TARGET_VALIDATOR="$PWD/target/.codex/validate_instructions.py" \
          TARGET_PROVISIONER="$PWD/target/.codex/provision_global_skills.py" \
          python3 - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path

          def dynamic_rebinding_names(node, protected):
              """Return protected names changed through dynamic module APIs."""

              names = set()
              if isinstance(node, ast.Subscript) and isinstance(node.value, ast.Call):
                  if isinstance(node.value.func, ast.Name) and node.value.func.id in {"globals", "locals"}:
                      key = node.slice.value if isinstance(node.slice, ast.Constant) else None
                      if isinstance(key, str) and key in protected:
                          names.add(key)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "setattr" and len(node.args) >= 2:
                  key = node.args[1].value if isinstance(node.args[1], ast.Constant) else None
                  if isinstance(key, str) and key in protected:
                      names.add(key)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  receiver = node.func.value
                  if isinstance(receiver, ast.Call) and isinstance(receiver.func, ast.Name) and receiver.func.id in {"globals", "locals"}:
                      method = node.func.attr
                      if method in {"clear", "popitem", "__ior__", "__or__"}:
                          names.update(protected)
                      elif method == "update":
                          # Mapping updates can use keyword arguments, a
                          # dict, or a computed mapping. Treat every
                          # protected target as potentially rebound rather
                          # than trying to execute contributor expressions.
                          names.update(protected)
                      elif method in {"__setitem__", "__delitem__", "setdefault", "pop"}:
                          if not node.args:
                              names.update(protected)
                          else:
                              key = node.args[0].value if isinstance(node.args[0], ast.Constant) else None
                              if isinstance(key, str) and key in protected:
                                  names.add(key)
              return names

          def is_main_guard(node):
              if not isinstance(node, ast.If):
                  return False
              test = node.test
              return (
                  isinstance(test, ast.Compare)
                  and len(test.ops) == 1
                  and isinstance(test.ops[0], ast.Eq)
                  and len(test.comparators) == 1
                  and (
                      (
                          isinstance(test.left, ast.Name)
                          and test.left.id == "__name__"
                          and isinstance(test.comparators[0], ast.Constant)
                          and test.comparators[0].value == "__main__"
                      )
                      or (
                          isinstance(test.left, ast.Constant)
                          and test.left.value == "__main__"
                          and isinstance(test.comparators[0], ast.Name)
                          and test.comparators[0].id == "__name__"
                      )
                  )
              )

          def function_header_nodes(function):
              nodes = list(getattr(function, "decorator_list", []))
              nodes.extend(getattr(function.args, "defaults", []))
              nodes.extend(value for value in getattr(function.args, "kw_defaults", []) if value is not None)
              arguments = [
                  *getattr(function.args, "posonlyargs", []),
                  *getattr(function.args, "args", []),
                  *getattr(function.args, "kwonlyargs", []),
              ]
              nodes.extend(
                  argument.annotation
                  for argument in arguments
                  if getattr(argument, "annotation", None) is not None
              )
              if getattr(function.args, "vararg", None) and function.args.vararg.annotation is not None:
                  nodes.append(function.args.vararg.annotation)
              if getattr(function.args, "kwarg", None) and function.args.kwarg.annotation is not None:
                  nodes.append(function.args.kwarg.annotation)
              if getattr(function, "returns", None) is not None:
                  nodes.append(function.returns)
              return nodes

          def is_safe_module_call(call):
              return (
                  isinstance(call.func, ast.Attribute)
                  and isinstance(call.func.value, ast.Name)
                  and call.func.value.id == "re"
                  and call.func.attr == "compile"
              )

          ALLOWED_IMPORT_ROOTS = {
              "__future__", "argparse", "hashlib", "io", "ipaddress", "json", "os",
              "pathlib", "re", "shutil", "stat", "subprocess", "sys", "tarfile",
              "tempfile", "typing", "urllib",
          }

          def check_imports(path, tree):
              """Keep protected modules on the standard-library/import-only surface."""

              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      modules = [alias.name.split(".", 1)[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          raise SystemExit(f"{path}: relative imports are not allowed")
                      modules = [(node.module or "").split(".", 1)[0]]
                  else:
                      continue
                  for module in modules:
                      if module not in ALLOWED_IMPORT_ROOTS:
                          raise SystemExit(f"{path}: unrecognized import root: {module}")
                      sibling = path.parent / f"{module}.py"
                      if sibling.exists() and sibling != path:
                          raise SystemExit(f"{path}: local module shadows imported standard module: {sibling.name}")
                      package = path.parent / module
                      if package.is_dir() and package != path.parent:
                          raise SystemExit(f"{path}: local package shadows imported standard module: {package.name}")

          def load_tree(path, required):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              check_imports(path, tree)
              definitions = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      definitions.setdefault(node.name, []).append(node.lineno)
              duplicate_required = sorted(
                  name for name in required if len(definitions.get(name, [])) > 1
              )
              if duplicate_required:
                  raise SystemExit(
                      f"{path}: duplicate protected definitions: {', '.join(duplicate_required)}"
                  )
              rebound_required = set()
              protected = set(required) | set(definitions)
              for node in tree.body:
                  if (
                      isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name in required
                      and any(isinstance(item, (ast.Yield, ast.YieldFrom)) for item in ast.walk(node))
                  ):
                      raise SystemExit(f"{path}: protected definition may not be a generator: {node.name}")
              for statement in tree.body:
                  if isinstance(statement, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      header_nodes = function_header_nodes(statement)
                      if statement.name in protected:
                          # A protected decorator or executable default can
                          # replace the call target before the entrypoint.
                          if isinstance(statement, ast.AsyncFunctionDef) or getattr(statement, "decorator_list", []):
                              rebound_required.add(statement.name)
                      elif getattr(statement, "decorator_list", []):
                          raise SystemExit(f"{path}: module-scope function decorators are not allowed")
                      if any(isinstance(node, ast.Call) for root in header_nodes for node in ast.walk(root)):
                          raise SystemExit(f"{path}: module-scope function header executes a call")
                      continue
                  if isinstance(statement, ast.ClassDef):
                      if statement.decorator_list or any(isinstance(node, ast.Call) for node in ast.walk(statement)):
                          raise SystemExit(f"{path}: module-scope class definition executes a call")
                      continue
                  if is_main_guard(statement):
                      # The exact entrypoint call is checked separately, but
                      # assignments/mutations inside the guard can still
                      # replace a protected dependency before main runs.
                      for node in ast.walk(statement):
                          if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.Delete)):
                              targets = []
                              if isinstance(node, ast.Assign):
                                  targets = node.targets
                              elif isinstance(node, ast.AnnAssign):
                                  targets = [node.target]
                              elif isinstance(node, ast.AugAssign):
                                  targets = [node.target]
                              elif isinstance(node, ast.Delete):
                                  targets = node.targets
                              if any(isinstance(target, (ast.Attribute, ast.Subscript)) for target in targets):
                                  raise SystemExit(f"{path}: module entrypoint mutates an imported or mapping target")
                              rebound_required.update(dynamic_rebinding_names(node, protected))
                              if any(
                                  isinstance(target, ast.Name) and target.id in protected
                                  for target in targets
                              ):
                                  rebound_required.update(
                                      target.id for target in targets if isinstance(target, ast.Name) and target.id in protected
                                  )
                      continue
                  if isinstance(statement, (ast.Import, ast.ImportFrom)):
                      continue
                  if isinstance(statement, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.Delete)):
                      targets = []
                      if isinstance(statement, ast.Assign):
                          targets = statement.targets
                      elif isinstance(statement, ast.AnnAssign):
                          targets = [statement.target]
                      elif isinstance(statement, ast.AugAssign):
                          targets = [statement.target]
                      elif isinstance(statement, ast.Delete):
                          targets = statement.targets
                      if any(isinstance(target, (ast.Attribute, ast.Subscript)) for target in targets):
                          raise SystemExit(f"{path}: module-scope mutation of an imported or mapping target is not allowed")
                  for node in ast.walk(statement):
                      if isinstance(node, ast.Call) and not is_safe_module_call(node):
                          raise SystemExit(f"{path}: module-scope executable call is not allowed")
                  for node in ast.walk(statement):
                      if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.Delete)):
                          targets = []
                          if isinstance(node, ast.Assign):
                              targets = node.targets
                          elif isinstance(node, ast.AnnAssign):
                              targets = [node.target]
                          elif isinstance(node, ast.AugAssign):
                              targets = [node.target]
                          elif isinstance(node, ast.Delete):
                              targets = node.targets
                          if any(isinstance(target, (ast.Attribute, ast.Subscript)) for target in targets):
                              raise SystemExit(f"{path}: module-scope mutation of an imported or mapping target is not allowed")
                      rebound_required.update(dynamic_rebinding_names(node, protected))
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name in protected:
                          rebound_required.add(node.name)
                      if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Store) and node.id in protected:
                          rebound_required.add(node.id)
                      if isinstance(node, ast.alias) and (node.asname or node.name) in protected:
                          rebound_required.add(node.asname or node.name)
              if rebound_required:
                  raise SystemExit(
                      f"{path}: protected definitions are rebound: {', '.join(sorted(rebound_required))}"
                  )
              missing = sorted(set(required) - set(definitions))
              if missing:
                  raise SystemExit(f"{path}: missing required definitions: {', '.join(missing)}")
              return tree

          validator = load_tree(
              Path(os.environ["TARGET_VALIDATOR"]),
              {"parse_yaml_mapping", "validate_asset", "check_agents_claude_consistency", "main", "has_secret", "has_secret_bytes", "has_locked_skill_secret", "has_locked_skill_secret_bytes", "skill_tree_digest", "validate_locked_skill", "_has_private_ip_literal", "_looks_like_placeholder", "_validate_skill_inventory", "_validate_claude_skill_aliases"},
          )
          provisioner_path = Path(os.environ["TARGET_PROVISIONER"])
          provisioner = load_tree(provisioner_path, {"load_manifest", "verify_registry", "tree_digest", "main"})

          # Approved target code is contributor-controlled and must not be
          # imported or executed inside pull_request_target. Check its
          # executable shape and immutable-pin constants as data only; the
          # trusted validator below remains the only code executed on target
          # contents in this job.
          for tree, forbidden in ((validator, {"exec", "eval", "__import__"}), (provisioner, {"exec", "eval", "__import__"})):
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  called_name = None
                  if isinstance(node.func, ast.Name):
                      called_name = node.func.id
                  elif isinstance(node.func, ast.Attribute):
                      called_name = node.func.attr
                  if called_name in forbidden:
                      raise SystemExit(f"approved governance code uses forbidden dynamic call: {called_name}")

          def assignment(tree, name):
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == name for target in node.targets):
                      try:
                          return ast.literal_eval(node.value)
                      except (ValueError, SyntaxError):
                          raise SystemExit(f"approved governance constant {name} must be a literal")
              raise SystemExit(f"approved governance constant {name} is missing")

          def function_node(tree, name):
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return node
              raise SystemExit(f"approved validator is missing function {name}")

          def check_module_entrypoint(tree, label):
              """Require a guarded, failure-propagating call to the inspected main."""

              for node_index, node in enumerate(tree.body):
                  if not isinstance(node, ast.If):
                      continue
                  test = node.test
                  guarded = (
                      isinstance(test, ast.Compare)
                      and len(test.ops) == 1
                      and isinstance(test.ops[0], ast.Eq)
                      and (
                          (isinstance(test.left, ast.Name) and test.left.id == "__name__"
                           and len(test.comparators) == 1
                           and isinstance(test.comparators[0], ast.Constant)
                           and test.comparators[0].value == "__main__")
                          or
                          (len(test.comparators) == 1
                           and isinstance(test.comparators[0], ast.Name)
                           and test.comparators[0].id == "__name__"
                           and isinstance(test.left, ast.Constant)
                           and test.left.value == "__main__")
                      )
                  )
                  if not guarded:
                      continue
                  main_calls = []
                  for statement in node.body:
                      for call in ast.walk(statement):
                          if isinstance(call, ast.Call) and isinstance(call.func, ast.Name) and call.func.id == "main":
                              main_calls.append(call)
                  if not main_calls:
                      raise SystemExit(f"approved {label} module entrypoint does not call main")
                  def valid_propagation(statement):
                      outer = None
                      if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                          outer = statement.value
                          if not (
                              isinstance(outer.func, ast.Attribute)
                              and isinstance(outer.func.value, ast.Name)
                              and outer.func.value.id == "sys"
                              and outer.func.attr == "exit"
                          ):
                              return False
                      elif isinstance(statement, ast.Raise) and isinstance(statement.exc, ast.Call):
                          outer = statement.exc
                          if not (isinstance(outer.func, ast.Name) and outer.func.id == "SystemExit"):
                              return False
                      else:
                          return False
                      return (
                          len(outer.args) == 1
                          and not outer.keywords
                          and isinstance(outer.args[0], ast.Call)
                          and isinstance(outer.args[0].func, ast.Name)
                          and outer.args[0].func.id == "main"
                          and not outer.args[0].keywords
                      )
                  if not any(valid_propagation(statement) for statement in node.body):
                      raise SystemExit(f"approved {label} module entrypoint has no exact failure-propagating statement")
                  if any(
                      not valid_propagation(statement)
                      and any(isinstance(item, ast.Call) for item in ast.walk(statement))
                      for statement in node.body
                  ):
                      raise SystemExit(f"approved {label} module entrypoint contains an unexpected executable call")
                  propagating = False
                  propagating_line = None
                  for statement in node.body:
                      if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                          outer = statement.value
                          if (
                              isinstance(outer.func, ast.Attribute)
                              and isinstance(outer.func.value, ast.Name)
                              and outer.func.value.id == "sys"
                              and outer.func.attr == "exit"
                              and any(call in outer.args for call in main_calls)
                          ):
                              propagating = True
                              propagating_line = statement.lineno
                      if isinstance(statement, ast.Raise) and isinstance(statement.exc, ast.Call):
                          outer = statement.exc
                          if (
                              isinstance(outer.func, ast.Name)
                              and outer.func.id == "SystemExit"
                              and any(call in outer.args for call in main_calls)
                          ):
                              propagating = True
                              propagating_line = statement.lineno
                  if not propagating:
                      raise SystemExit(f"approved {label} module entrypoint must propagate main status")
                  if direct_terminator_lines(tree.body[:node_index]):
                      raise SystemExit(f"approved {label} module entrypoint is preceded by a terminating module statement")
                  if any(line < propagating_line for line in direct_terminator_lines(node.body)):
                      raise SystemExit(f"approved {label} module entrypoint can terminate before main")
                  return
              raise SystemExit(f"approved {label} is missing an __main__ entrypoint")

          def constant_truth(node):
              if isinstance(node, ast.Constant):
                  return bool(node.value)
              if isinstance(node, ast.UnaryOp) and isinstance(node.op, ast.Not):
                  inner = constant_truth(node.operand)
                  return None if inner is None else not inner
              if isinstance(node, ast.Compare) and len(node.ops) == len(node.comparators):
                  values = [node.left, *node.comparators]
                  if not all(isinstance(value, ast.Constant) for value in values):
                      return None
                  result = True
                  for left, op, right in zip(values, node.ops, node.comparators):
                      left_value = left.value
                      right_value = right.value
                      if isinstance(op, ast.Eq):
                          result = result and left_value == right_value
                      elif isinstance(op, ast.NotEq):
                          result = result and left_value != right_value
                      elif isinstance(op, ast.Is):
                          result = result and left_value is right_value
                      elif isinstance(op, ast.IsNot):
                          result = result and left_value is not right_value
                      else:
                          return None
                  return result
              return None

          class ReachableCalls(ast.NodeVisitor):
              def __init__(self):
                  self.names = set()
                  self.direct_calls = {}
                  self.call_receivers = {}
                  self.strings = set()
                  self.calls = {}
                  self.returns = []

              def visit_Call(self, node):
                  if isinstance(node.func, ast.Name):
                      name = node.func.id
                      self.direct_calls.setdefault(name, []).append(node.lineno)
                  elif isinstance(node.func, ast.Attribute):
                      name = node.func.attr
                      receiver = node.func.value
                      while isinstance(receiver, ast.Attribute):
                          receiver = receiver.value
                      if isinstance(receiver, ast.Name):
                          self.call_receivers.setdefault(name, set()).add(receiver.id)
                  else:
                      name = None
                  if name:
                      self.names.add(name)
                      self.calls.setdefault(name, []).append(node.lineno)
                  self.generic_visit(node)

              def visit_Return(self, node):
                  self.returns.append(node.lineno)
                  self.generic_visit(node)

              def visit_Constant(self, node):
                  if isinstance(node.value, str):
                      self.strings.add(node.value)

              def _visit_block(self, statements):
                  """Visit only statements that can execute in this block."""

                  for child in statements:
                      self.visit(child)
                      if isinstance(child, (ast.Return, ast.Raise, ast.Break, ast.Continue)):
                          break
                      if (
                          isinstance(child, ast.Expr)
                          and isinstance(child.value, ast.Call)
                          and (
                              (isinstance(child.value.func, ast.Name) and child.value.func.id in {"exit", "quit"})
                              or (
                                  isinstance(child.value.func, ast.Attribute)
                                  and isinstance(child.value.func.value, ast.Name)
                                  and (
                                      (child.value.func.value.id in {"sys", "builtins"} and child.value.func.attr == "exit")
                                      or (child.value.func.value.id == "os" and child.value.func.attr == "_exit")
                                  )
                              )
                          )
                      ):
                          break

              def visit_If(self, node):
                  self.visit(node.test)
                  truth = constant_truth(node.test)
                  branch = node.body if truth is True else node.orelse if truth is False else node.body + node.orelse
                  self._visit_block(branch)

              def visit_For(self, node):
                  self.visit(node.target)
                  self.visit(node.iter)
                  empty_iter = (
                      isinstance(node.iter, (ast.Tuple, ast.List, ast.Set, ast.Dict))
                      and not getattr(node.iter, "elts", getattr(node.iter, "keys", []))
                  ) or (
                      isinstance(node.iter, ast.Call)
                      and isinstance(node.iter.func, ast.Name)
                      and node.iter.func.id == "range"
                      and node.iter.args
                      and all(isinstance(arg, ast.Constant) for arg in node.iter.args)
                      and len(range(*[arg.value for arg in node.iter.args])) == 0
                  )
                  if not empty_iter:
                      self._visit_block(node.body)
                  if node.orelse:
                      self._visit_block(node.orelse)

              visit_AsyncFor = visit_For

              def visit_While(self, node):
                  self.visit(node.test)
                  truth = constant_truth(node.test)
                  branch = node.body if truth is not False else node.orelse
                  self._visit_block(branch)

              def visit_Try(self, node):
                  # Exception handlers are conditional recovery paths, not an
                  # unconditional validation path. Traverse the try body and
                  # finally blocks; ``else`` runs only when the try body
                  # succeeds, so a required call there cannot satisfy the
                  # unconditional-path contract. Handlers are recovery paths
                  # and are deliberately excluded as well.
                  self._visit_block(node.body)
                  self._visit_block(node.finalbody)

              visit_TryStar = visit_Try

              def visit_FunctionDef(self, node):
                  # Nested functions are not part of the enclosing function's
                  # reachable validation path.
                  return

              visit_AsyncFunctionDef = visit_FunctionDef

              def visit_Lambda(self, node):
                  return

          def reachable_called_names(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor.names

          def reachable_string_literals(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor.strings

          def reachable_info(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor

          def runtime_guarded_direct_calls(node, names):
              """Return protected calls reachable only under process-state guards."""

              counts = {}

              class Finder(ast.NodeVisitor):
                  def __init__(self):
                      self.runtime_depth = 0

                  def visit_Call(self, call):
                      if isinstance(call.func, ast.Name) and call.func.id in names:
                          guarded_count, total_count = counts.get(call.func.id, (0, 0))
                          counts[call.func.id] = (guarded_count + bool(self.runtime_depth), total_count + 1)
                      self.generic_visit(call)

                  def visit_If(self, branch):
                      process_state = any(
                          isinstance(item, ast.Name) and item.id in {"sys", "os", "builtins"}
                          or isinstance(item, ast.Attribute) and item.attr in {"argv", "environ", "getenv"}
                          for item in ast.walk(branch.test)
                      )
                      if process_state:
                          self.runtime_depth += 1
                      self.visit(branch.test)
                      for child in branch.body + branch.orelse:
                          self.visit(child)
                      if process_state:
                          self.runtime_depth -= 1

              finder = Finder()
              for statement in node.body:
                  finder.visit(statement)
              return counts

          def function_bindings(node):
              """Return names locally rebound inside one function."""

              bindings = {argument.arg for argument in node.args.posonlyargs + node.args.args + node.args.kwonlyargs}
              if node.args.vararg:
                  bindings.add(node.args.vararg.arg)
              if node.args.kwarg:
                  bindings.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Store):
                      bindings.add(child.id)
              return bindings

          def unconditional_calls(node, name):
              """Return calls not hidden behind a runtime branch or loop."""

              found = []

              class Finder(ast.NodeVisitor):
                  def __init__(self):
                      self.conditional_depth = 0

                  def visit_Call(self, call):
                      if self.conditional_depth == 0 and isinstance(call.func, ast.Name) and call.func.id == name:
                          found.append(call)
                      self.generic_visit(call)

                  def visit_If(self, branch):
                      self.visit(branch.test)
                      self.conditional_depth += 1
                      for child in branch.body + branch.orelse:
                          self.visit(child)
                      self.conditional_depth -= 1

                  def visit_For(self, loop):
                      self.visit(loop.iter)
                      self.conditional_depth += 1
                      for child in loop.body + loop.orelse:
                          self.visit(child)
                      self.conditional_depth -= 1

                  visit_AsyncFor = visit_For

                  def visit_While(self, loop):
                      self.visit(loop.test)
                      self.conditional_depth += 1
                      for child in loop.body + loop.orelse:
                          self.visit(child)
                      self.conditional_depth -= 1

                  def visit_With(self, context):
                      for item in context.items:
                          self.visit(item.context_expr)
                          if item.optional_vars:
                              self.visit(item.optional_vars)
                      # Context managers such as contextlib.suppress can
                      # swallow the required validator call and let a
                      # success return continue. Treat every with-body as a
                      # conditional path for the same reason as exception
                      # handlers and loops.
                      self.conditional_depth += 1
                      for child in context.body:
                          self.visit(child)
                      self.conditional_depth -= 1

                  visit_AsyncWith = visit_With

                  def visit_Try(self, statement):
                      # Calls in handlers and ``else`` blocks execute only
                      # after a conditional exception outcome. Calls in the
                      # try/finally path remain visible as unconditional.
                      for child in statement.body + statement.finalbody:
                          self.visit(child)
                      self.conditional_depth += 1
                      for handler in statement.handlers:
                          for child in handler.body:
                              self.visit(child)
                      for child in statement.orelse:
                          self.visit(child)
                      self.conditional_depth -= 1

                  visit_TryStar = visit_Try

                  def visit_BoolOp(self, expression):
                      # In ``a and required()`` / ``a or required()``, every
                      # operand after the first is conditional on short
                      # circuit evaluation.
                      for index, value in enumerate(expression.values):
                          if index:
                              self.conditional_depth += 1
                          self.visit(value)
                          if index:
                              self.conditional_depth -= 1

                  def visit_IfExp(self, expression):
                      self.visit(expression.test)
                      self.conditional_depth += 1
                      self.visit(expression.body)
                      self.visit(expression.orelse)
                      self.conditional_depth -= 1

                  def visit_ListComp(self, comprehension):
                      self.conditional_depth += 1
                      self.generic_visit(comprehension)
                      self.conditional_depth -= 1

                  visit_SetComp = visit_ListComp
                  visit_DictComp = visit_ListComp
                  visit_GeneratorExp = visit_ListComp

                  def visit_FunctionDef(self, function):
                      return

                  visit_AsyncFunctionDef = visit_FunctionDef

                  def visit_Lambda(self, function):
                      return

              finder = Finder()
              for statement in node.body:
                  finder.visit(statement)
              return found

          def direct_terminator_lines(statements):
              """Find unconditional returns, raises, and process exits in a body."""

              lines = []
              for statement in statements:
                  if isinstance(statement, (ast.Return, ast.Raise)):
                      lines.append(statement.lineno)
                      continue
                  if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                      call = statement.value
                      exits = (
                          isinstance(call.func, ast.Name) and call.func.id in {"exit", "quit"}
                      ) or (
                          isinstance(call.func, ast.Attribute)
                          and isinstance(call.func.value, ast.Name)
                          and (
                              (call.func.value.id in {"sys", "builtins"} and call.func.attr == "exit")
                              or (call.func.value.id == "os" and call.func.attr == "_exit")
                          )
                      )
                      if exits:
                          lines.append(statement.lineno)
                          continue
                  if isinstance(statement, ast.If):
                      truth = constant_truth(statement.test)
                      branch = statement.body if truth is True else statement.orelse if truth is False else None
                      if branch is not None:
                          lines.extend(direct_terminator_lines(branch))
                  try_nodes = (ast.Try,) + ((ast.TryStar,) if hasattr(ast, "TryStar") else ())
                  if isinstance(statement, try_nodes):
                      body_terminators = direct_terminator_lines(statement.body)
                      lines.extend(body_terminators)
                      if body_terminators:
                          for handler in statement.handlers:
                              lines.extend(direct_terminator_lines(handler.body))
                      lines.extend(direct_terminator_lines(statement.orelse))
                      lines.extend(direct_terminator_lines(statement.finalbody))
              return lines

          def check_exception_handlers(node, required_names, label):
              """Reject handlers that turn required-operation failures into success."""

              for try_node in ast.walk(node):
                  if not isinstance(try_node, (ast.Try,) + ((ast.TryStar,) if hasattr(ast, "TryStar") else ())):
                      continue
                  try_calls = {
                      call.func.id
                      for statement in try_node.body
                      for call in ast.walk(statement)
                      if isinstance(call, ast.Call) and isinstance(call.func, ast.Name)
                  }
                  if not (try_calls & set(required_names)):
                      continue
                  for handler in try_node.handlers:
                      handler_calls = {
                          call.func.id
                          for statement in handler.body
                          for call in ast.walk(statement)
                          if isinstance(call, ast.Call) and isinstance(call.func, ast.Name)
                      }
                      if handler_calls & set(required_names):
                          continue
                      if any(isinstance(statement, ast.Raise) for statement in handler.body):
                          continue
                      if direct_terminator_lines(handler.body):
                          raise SystemExit(f"approved {label} exception handler suppresses required-operation failure")
                      # A handler may convert an exception to an explicit
                      # failed result, but it must not silently continue with
                      # an unknown/success state.
                      has_false = any(isinstance(item, ast.Constant) and item.value is False for statement in handler.body for item in ast.walk(statement))
                      if not has_false:
                          raise SystemExit(f"approved {label} exception handler does not preserve failure")

          def module_rebindings(tree, names):
              """Find module-scope assignments/imports that replace call targets."""

              protected = set(names)
              defined = set()
              rebound = set()
              imported = set()
              for statement in tree.body:
                  if isinstance(statement, ast.Import):
                      imported.update(alias.asname or alias.name.split(".", 1)[0] for alias in statement.names)
                  elif isinstance(statement, ast.ImportFrom) and statement.module:
                      imported.update(alias.asname or alias.name for alias in statement.names)
              for statement in tree.body:
                  if isinstance(statement, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if statement.name in protected:
                          if isinstance(statement, ast.ClassDef) or statement.name in defined or getattr(statement, "decorator_list", []):
                              rebound.add(statement.name)
                          defined.add(statement.name)
                      continue
                  for node in ast.walk(statement):
                      rebound.update(dynamic_rebinding_names(node, protected))
                      if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign, ast.Delete)):
                          targets = node.targets if isinstance(node, (ast.Assign, ast.Delete)) else [node.target]
                          for target in targets:
                              root = target
                              while isinstance(root, (ast.Attribute, ast.Subscript)):
                                  root = root.value
                              if isinstance(root, ast.Name) and root.id in imported and isinstance(target, (ast.Attribute, ast.Subscript)):
                                  rebound.add(f"{root.id}.*")
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name in protected:
                          rebound.add(node.name)
                      if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Store) and node.id in protected:
                          rebound.add(node.id)
                      if isinstance(node, ast.alias) and (node.asname or node.name) in protected:
                          rebound.add(node.asname or node.name)
              return rebound

          def check_has_secret_shape(node):
              """Require secret-detection results to reach a failure return."""

              def static_truth(expression):
                  """Evaluate only Python expressions whose truth is static."""

                  if isinstance(expression, ast.Constant):
                      return bool(expression.value)
                  if isinstance(expression, (ast.List, ast.Tuple, ast.Set, ast.Dict)):
                      elements = expression.elts if not isinstance(expression, ast.Dict) else expression.keys
                      return bool(elements)
                  if isinstance(expression, ast.UnaryOp) and isinstance(expression.op, ast.Not):
                      value = static_truth(expression.operand)
                      return None if value is None else not value
                  if isinstance(expression, ast.BoolOp):
                      values = [static_truth(value) for value in expression.values]
                      if isinstance(expression.op, ast.And):
                          if any(value is False for value in values):
                              return False
                          return True if all(value is True for value in values) else None
                      if any(value is True for value in values):
                          return True
                      return False if all(value is False for value in values) else None
                  if isinstance(expression, ast.Compare) and len(expression.ops) == 1:
                      try:
                          left = ast.literal_eval(expression.left)
                          right = ast.literal_eval(expression.comparators[0])
                      except (ValueError, TypeError, SyntaxError):
                          return None
                      operation = expression.ops[0]
                      try:
                          if isinstance(operation, ast.Eq):
                              return left == right
                          if isinstance(operation, ast.NotEq):
                              return left != right
                          if isinstance(operation, ast.Is):
                              return left is right
                          if isinstance(operation, ast.IsNot):
                              return left is not right
                          if isinstance(operation, ast.Lt):
                              return left < right
                          if isinstance(operation, ast.LtE):
                              return left <= right
                          if isinstance(operation, ast.Gt):
                              return left > right
                          if isinstance(operation, ast.GtE):
                              return left >= right
                          if isinstance(operation, ast.In):
                              return left in right
                          if isinstance(operation, ast.NotIn):
                              return left not in right
                      except (TypeError, ValueError):
                          return None
                  return None

              def statically_false(expression):
                  """Reject a secret pre-check hidden behind constant-false logic."""

