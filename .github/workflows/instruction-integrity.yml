            raise "instruction protection must begin with the trusted contract guard" unless protection_shell_lines.first == "if test ! -f trusted/.codex/instruction-integrity.json; then"
            raise "instruction protection contains an unexpected pre-validation branch" if protection_shell_lines[1...].any? { |line| line.start_with?("if ") }
            raise "instruction protection step does not compare trusted and target surfaces" unless protection_run.include?("set(trusted_files) != set(target_files)") && protection_run.include?("target_files[relative]")
          RUBY
      - name: Protect instruction contents unless explicitly approved
        if: env.GOVERNANCE_UPDATE_APPROVED != 'true'
        run: |
          if test ! -f trusted/.codex/instruction-integrity.json; then
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import stat
          import sys
          from pathlib import Path

          trusted_root = Path("trusted")
          target_root = Path("target")
          contract = json.loads((trusted_root / ".codex/instruction-integrity.json").read_text())
          sys.path.insert(0, str((trusted_root / ".codex").resolve()))
          from validate_instructions import REFERENCE_TEXT_SUFFIXES, _is_external_target, _is_within, _markdown_targets, _normalize_reference_target

          def check_claude_skill_aliases(root, raw_paths):
              allowed = {
                  Path(str(raw)).parts[2]
                  for raw in raw_paths
                  if len(Path(str(raw)).parts) >= 3
                  and Path(str(raw)).parts[:2] == (".agents", "skills")
              }
              lock_path = root / "skills-lock.json"
              if lock_path.is_file():
                  lock = json.loads(lock_path.read_text(encoding="utf-8"))
                  skills = lock.get("skills", {})
                  if isinstance(skills, dict):
                      allowed.update(str(name) for name in skills)
              alias_root = root / ".claude" / "skills"
              if not alias_root.exists() and not alias_root.is_symlink():
                  return
              if alias_root.is_symlink():
                  raise SystemExit(f"Claude skill alias root may not be a symlink: {alias_root}")
              for alias in alias_root.iterdir():
                  if alias.is_symlink():
                      expected = root / ".agents" / "skills" / alias.name
                      if alias.name not in allowed:
                          raise SystemExit(f"Claude skill alias is not contracted or lock-listed: {alias}")
                      try:
                          target = alias.resolve(strict=True)
                          expected_target = expected.resolve(strict=True)
                      except OSError as exc:
                          raise SystemExit(f"Claude skill alias target is unavailable: {alias}: {exc}") from exc
                      if target != expected_target or not expected_target.is_dir():
                          raise SystemExit(f"Claude skill alias must target {expected}: {alias}")

          def surface(root, raw_paths):
              files = {}
              paths = {Path(raw) for raw in raw_paths}
              # Every repository-owned scoped entrypoint is governed, while
              # installer-owned plugin skill mounts remain preserved inputs.
              unmanaged_prefixes = {(".agents", "skills")}
              for item in root.rglob("*"):
                  relative = item.relative_to(root)
                  if any(part in {".git", "node_modules", ".next"} for part in relative.parts):
                      continue
                  if (
                      len(relative.parts) >= 3
                      and relative.parts[:2] == (".claude", "skills")
                      and (root / Path(*relative.parts[:3])).is_symlink()
                  ):
                      # Legacy Claude plugin aliases are symlinks and remain
                      # outside this repository-owned governance surface.
                      continue
                  if any(
                      len(relative.parts) >= len(prefix) and relative.parts[: len(prefix)] == prefix
                      for prefix in unmanaged_prefixes
                  ):
                      continue
                  if item.name in {"AGENTS.md", "AGENTS.override.md", "CLAUDE.md"}:
                      paths.add(relative)
                  if len(relative.parts) >= 3 and relative.parts[:2] in {(".claude", "agents"), (".claude", "rules")} and item.suffix.casefold() == ".md":
                      paths.add(relative)
                  if len(relative.parts) >= 4 and relative.parts[:2] == (".claude", "skills") and item.name == "SKILL.md":
                      paths.add(relative)
              for relative in sorted(paths, key=str):
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"trusted contract path is not repository-relative: {relative}")
                  path = root / relative
                  current = root
                  for part in relative.parts:
                      current /= part
                      if current.is_symlink():
                          raise SystemExit(f"governed instruction may not traverse a symlink: {relative}")
                  if path.is_file():
                      candidates = [path]
                  elif path.is_dir():
                      if path.is_symlink():
                          raise SystemExit(f"governed instruction directory may not be a symlink: {relative}")
                      candidates = []
                      for item in path.rglob("*"):
                          if item.is_symlink():
                              raise SystemExit(f"governed instruction may not be a symlink: {item.relative_to(root)}")
                          if item.is_file():
                              candidates.append(item)
                  else:
                      raise SystemExit(f"required instruction missing from trusted/target tree: {relative}")
                  for item in candidates:
                      if item.is_symlink():
                          raise SystemExit(f"governed instruction may not be a symlink: {item.relative_to(root)}")
                      item_relative = item.relative_to(root)
                      files[str(item_relative)] = (
                          hashlib.sha256(item.read_bytes()).hexdigest(),
                          stat.S_IMODE(item.stat().st_mode),
                      )
              pending = list(files)
              seen: set[str] = set()
              repo_root = root.resolve()
              while pending:
                  relative = pending.pop()
                  if relative in seen:
                      continue
                  seen.add(relative)
                  path = root / relative
                  if not path.is_file():
                      continue
                  is_reference_text = path.suffix.casefold() in REFERENCE_TEXT_SUFFIXES or path.suffix == ""
                  if not is_reference_text:
                      continue
                  text = path.read_text(encoding="utf-8")
                  for raw_target in _markdown_targets(text):
                      target = _normalize_reference_target(raw_target)
                      if not target or _is_external_target(target):
                          continue
                      lexical = path.parent / target
                      candidate = lexical.resolve()
                      try:
                          lexical_relative = lexical.absolute().relative_to(root.absolute())
                      except ValueError:
                          continue
                      current = root
                      for part in lexical_relative.parts:
                          current /= part
                          if current.is_symlink():
                              raise SystemExit(f"governed referenced instruction may not traverse a symlink: {lexical_relative}")
                      if not candidate.is_file():
                          continue
                      if not _is_within(candidate, repo_root):
                          continue
                      referenced = str(candidate.relative_to(repo_root))
                      if referenced not in files:
                          files[referenced] = (
                              hashlib.sha256(candidate.read_bytes()).hexdigest(),
                              stat.S_IMODE(candidate.stat().st_mode),
                          )
                          if candidate.suffix.casefold() in REFERENCE_TEXT_SUFFIXES or candidate.suffix == "":
                              pending.append(referenced)
              return files

          paths = list(contract.get("required_agents", [])) + list(contract.get("required_skills", []))
          check_claude_skill_aliases(trusted_root, paths)
          check_claude_skill_aliases(target_root, paths)
          trusted_files = surface(trusted_root, paths)
          target_files = surface(target_root, paths)
          if set(trusted_files) != set(target_files):
              raise SystemExit("governed instruction surface changed without instruction-governance-approved label")
          for relative, digest in trusted_files.items():
              if target_files[relative] != digest:
                  raise SystemExit(f"governed instruction changed without instruction-governance-approved label: {relative}")
          PY
      - name: Validate AGENTS.md and skills
        id: validate_instructions
        run: |
          expected_config_commit="$(python3 -c 'import json; print(json.load(open("trusted/.codex/instruction-integrity.json", encoding="utf-8"))["canonical_config_commit"])')"
          extra_args=()
          if test "$GOVERNANCE_UPDATE_APPROVED" = true; then
            extra_args+=(--allow-config-commit-update)
          fi
          python3 trusted/.codex/validate_instructions.py "${extra_args[@]}" \
            --repo target \
            --contract target/.codex/instruction-integrity.json \
            --policy target/.codex/instruction-policy.v1.json \
            --trusted-policy trusted/.codex/instruction-policy.v1.json \
            --trusted-contract trusted/.codex/instruction-integrity.json \
            --expected-config-commit "$expected_config_commit" \
            --registry-source registry-source \
            --json
      - name: Publish head-associated instruction-integrity check
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_OUTCOME: ${{ steps.validate_instructions.outcome }}
        run: |
          set -eu
          case "$HEAD_SHA" in
            ''|*[!0-9a-f]*)
              echo 'pull request head is not a full lowercase commit SHA' >&2
              exit 1
              ;;
          esac
          conclusion=success
          test "$VALIDATION_OUTCOME" = success || conclusion=failure
          python3 - "$HEAD_SHA" "$conclusion" <<'PY' > /tmp/instruction-integrity-check.json
          import json
          import sys

          head_sha, conclusion = sys.argv[1:]
          print(json.dumps({
              "name": "instruction-integrity",
              "head_sha": head_sha,
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": "Trusted instruction integrity gate",
                  "summary": "Published by the base-branch pull_request_target workflow.",
              },
          }))
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            --input /tmp/instruction-integrity-check.json >/dev/null
