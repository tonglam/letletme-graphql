name: instruction-integrity

on:
  # pull_request is a minimal, secret-free bootstrap check. Once this workflow
  # exists on the base branch, pull_request_target is the blocking trusted gate.
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .codex/**
      - .github/workflows/instruction-integrity.yml
  # The base-branch workflow is trusted; the proposed checkout is data only.
  # Label changes must re-evaluate the exact labeled head, and removing the
  # label must revoke the transition immediately.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  # pull_request_target exposes the base ref as github.ref; use the PR number
  # so one PR cannot cancel another. Push runs remain grouped by branch.
  # Keep approval and metadata/base-edit events from cancelling one another;
  # synchronize runs for the same PR still cancel their older sibling.
  group: instruction-integrity-${{ github.event_name }}-${{ github.event.action || 'push' }}-${{ github.repository }}-${{ github.event.pull_request.number || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name == 'pull_request'
    # This is the head-associated required check.  It executes only the
    # immutable validator checked out from the base branch against the
    # proposed tree, so the check reports the exact pull-request head while
    # never importing contributor-controlled Python.
    name: instruction-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout proposed tree (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
      - name: Checkout trusted base validator (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Require the governance scaffold
        working-directory: target
        run: |
          for file in AGENTS.md .codex/global-skills.json .codex/instruction-integrity.json .codex/validate_instructions.py .codex/provision_global_skills.py .codex/instruction-policy.v1.json .github/workflows/instruction-integrity.yml; do
            test -s "$file" && test ! -L "$file"
          done
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          def fail(message):
              raise SystemExit(message)

          def load_object(relative):
              try:
                  value = json.loads((root / relative).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError) as error:
                  fail(f'{relative}: invalid JSON: {error}')
              if not isinstance(value, dict):
                  fail(f'{relative}: expected a JSON object')
              return value

          contract = load_object('.codex/instruction-integrity.json')
          if contract.get('version') != 1:
              fail('contract version must be 1')
          for key in ('required_agents', 'required_skills', 'required_global_skills'):
              value = contract.get(key)
              if not isinstance(value, list) or not value or not all(isinstance(item, str) and item.strip() for item in value):
                  fail(f'contract {key} must be a non-empty string list')
              if len(set(value)) != len(value):
                  fail(f'contract {key} must not contain duplicates')
          if not re.fullmatch(r'[0-9a-fA-F]{7,40}', str(contract.get('canonical_config_commit', ''))):
              fail('contract canonical_config_commit must be a hexadecimal revision')
          policy = load_object('.codex/instruction-policy.v1.json')
          rules = policy.get('review_rules')
          required_rules = {'codex_quota', 'tests_and_scripts', 'all_other_paths', 'all_findings', 'post_merge_cleanup'}
          if policy.get('version') != 1 or not isinstance(rules, dict) or set(rules) != required_rules:
              fail('policy must contain version 1 and every review rule')
          if 'tests' not in rules['tests_and_scripts'] or 'scripts' not in rules['tests_and_scripts']:
              fail('policy must preserve the tests/scripts exception')
          if 'P2' not in rules['all_other_paths'] or 'P3' not in rules['all_other_paths']:
              fail('policy must require non-test P2/P3 fixes')
          manifest = load_object('.codex/global-skills.json')
          registry = manifest.get('registry')
          if manifest.get('version') != 1 or not isinstance(registry, dict) or not re.fullmatch(r'[0-9a-f]{40}', str(registry.get('ref', ''))) or not re.fullmatch(r'[0-9a-f]{64}', str(registry.get('sha256', ''))):
              fail('global manifest must pin a full commit and content digest')
          if not isinstance(manifest.get('skills'), list) or len(set(manifest['skills'])) != len(manifest['skills']) or set(manifest['skills']) != set(contract['required_global_skills']):
              fail('global manifest skill list must match the contract')
          agents = ' '.join((root / 'AGENTS.md').read_text(encoding='utf-8').casefold().split())
          required_clauses = (
              'review may be skipped only after two consecutive explicit quota-limit responses',
              'every p0-p3 finding must be dispositioned and its thread resolved',
              'only a finding confined to tests/scripts gets the time exception',
              'p2/p3 anywhere else must be actually fixed and verified',
              'merge is prohibited while any finding is undispositioned or any review thread is unresolved',
              'after merge, clean only the exact corresponding worktree, local branch, and remote branch',
          )
          if len(agents) < 200 or not all(clause in agents for clause in required_clauses):
              fail('AGENTS.md is missing the operative governance clauses')
          for raw in contract['required_agents']:
              path = root / raw
              if not path.is_file() or path.is_symlink() or not path.read_text(encoding='utf-8').strip():
                  fail(f'required AGENTS file is missing, empty, or symlinked: {raw}')
          for raw in contract['required_skills']:
              path = root / raw
              entry = path if path.name == 'SKILL.md' else path / 'SKILL.md'
              if not path.is_dir() or not entry.is_file() or entry.is_symlink():
                  fail(f'required skill entrypoint is missing, not a directory, or symlinked: {raw}')
              text = entry.read_text(encoding='utf-8')
              if not re.match(r'\A---\s*\n', text) or not re.search(r'(?m)^name:\s*\S+', text) or not re.search(r'(?m)^description:\s*\S+', text) or not text.split('---', 2)[-1].strip():
                  fail(f'skill entrypoint has invalid frontmatter or no body: {raw}')
          print('bootstrap structural and governance checks passed')
          PY
      - name: Validate pull request head with trusted validator
        run: |
          python3 trusted/.codex/validate_instructions.py \
            --repo target \
            --contract target/.codex/instruction-integrity.json \
            --policy target/.codex/instruction-policy.v1.json \
            --trusted-contract trusted/.codex/instruction-integrity.json \
            --trusted-policy trusted/.codex/instruction-policy.v1.json
  validate:
    if: github.event_name == 'pull_request_target' || github.event_name == 'push'
    name: instruction-integrity-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Approval is valid only for the labeled event's exact head. A later
      # synchronize event is unapproved until the maintainer labels that new
      # head again, so a persistent label cannot authorize unseen commits.
      GOVERNANCE_UPDATE_APPROVED: ${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'instruction-governance-approved' && contains(github.event.pull_request.labels.*.name, 'instruction-governance-approved') && github.event.sender.login == github.repository_owner }}
    steps:
      - name: Checkout proposed tree (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false
      - name: Checkout trusted base contract and validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      # Materialize the immutable registry before any proposed instruction
      # filesystem is inspected. The validator below consumes this checkout;
      # it is never allowed to trust a registry file supplied by the PR.
      - name: Verify pinned global registry contents
        run: |
          set -eu
          manifest="target/.codex/global-skills.json"
          GOVERNANCE_UPDATE_APPROVED="$GOVERNANCE_UPDATE_APPROVED" python3 - "$manifest" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          descriptor = manifest.get("registry")
          expected = {
              "repository": "tonglam/codex-workspace-config",
              "ref": "7e92336ec04d38f7bb95620e304ce6ec6567c896",
              "path": "registry/workspace-assets.json",
              "sha256": "fa1a2a5448e34376c4dccfe43c6c8a901adb9b62df3995b1f11d3aa4b9b77cb6",
          }
          approved = os.environ.get("GOVERNANCE_UPDATE_APPROVED") == "true"
          target_contract = json.loads(Path("target/.codex/instruction-integrity.json").read_text(encoding="utf-8"))
          expected_source_revision = target_contract.get("canonical_config_commit") if approved else "312eaf56264f65bcc74fd7b81d8981a3517eca02"
          if not approved and descriptor != expected:
              raise SystemExit("global registry descriptor is not the trusted immutable pin")
          if approved:
              if not isinstance(descriptor, dict) or descriptor.get("repository") != expected["repository"] or descriptor.get("path") != expected["path"]:
                  raise SystemExit("approved registry transition must remain on the trusted workspace registry")
              if not isinstance(descriptor.get("ref"), str) or not re.fullmatch(r"[0-9a-f]{40}", descriptor["ref"]):
                  raise SystemExit("approved registry transition requires a full registry commit")
              if not isinstance(descriptor.get("sha256"), str) or not re.fullmatch(r"[0-9a-f]{64}", descriptor["sha256"]):
                  raise SystemExit("approved registry transition requires a 64-character content digest")
              if not isinstance(expected_source_revision, str) or not re.fullmatch(r"[0-9a-f]{40}", expected_source_revision):
                  raise SystemExit("approved registry transition requires a full canonical source revision")
          checkout = Path("registry-source")
          subprocess.run(
              ["git", "clone", "--filter=blob:none", "--no-checkout", "--depth=1", "--no-tags",
               f"https://github.com/{descriptor['repository']}.git", str(checkout)],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          subprocess.run(["git", "-C", str(checkout), "fetch", "--depth=1", "origin", descriptor["ref"]], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(["git", "-C", str(checkout), "checkout", "--detach", descriptor["ref"]], check=True, stdout=subprocess.DEVNULL)
          if approved:
              subprocess.run(["git", "-C", str(checkout), "fetch", "--depth=1", "origin", expected_source_revision], check=True, stdout=subprocess.DEVNULL)
          blob = subprocess.check_output(["git", "-C", str(checkout), "show", f"{descriptor['ref']}:{descriptor['path']}"])
          if hashlib.sha256(blob).hexdigest() != descriptor["sha256"]:
              raise SystemExit("pinned registry content digest mismatch")
          source = json.loads(blob)
          if source.get("source", {}).get("revision") != expected_source_revision:
              raise SystemExit("pinned registry source revision is not the trusted canonical configuration")
          allowlist = source.get("governance", {}).get("global_skill_allowlist", [])
          names = {Path(item).name for item in allowlist if isinstance(item, str)}
          advertised = manifest.get("skills", [])
          missing = sorted(set(advertised) - names)
          if missing:
              raise SystemExit(f"pinned registry is missing advertised global skills: {', '.join(missing)}")
          missing_trees = []
          for name in advertised:
              skill = checkout / "global" / "skills" / name
              entry = skill / "SKILL.md"
              if skill.is_symlink() or entry.is_symlink() or not skill.is_dir() or not entry.is_file():
                  missing_trees.append(name)
              elif any(item.is_symlink() for item in skill.rglob("*")):
                  missing_trees.append(name)
          if missing_trees:
              raise SystemExit(f"pinned registry is missing advertised skill trees: {', '.join(sorted(missing_trees))}")
          print("pinned global registry content verified")
          PY
      - name: Protect the integrity gate files
        run: |
          approved="$GOVERNANCE_UPDATE_APPROVED"
          for file in \
            .github/workflows/instruction-integrity.yml \
            .codex/validate_instructions.py \
            .codex/instruction-policy.v1.json \
            .codex/instruction-integrity.json \
            .codex/global-skills.json \
            .codex/provision_global_skills.py; do
            if test -e "trusted/$file" && test "$approved" != true; then
              test ! -L "trusted/$file"
              test -f "target/$file" && test ! -L "target/$file"
              cmp -s "trusted/$file" "target/$file" || {
                echo "governance gate file changed: $file"
                exit 1
              }
            else
              test -s "target/$file" && test ! -L "target/$file"
            fi
          done
          if test "$approved" = true; then
            python3 -m py_compile target/.codex/validate_instructions.py target/.codex/provision_global_skills.py
          TARGET_VALIDATOR="$PWD/target/.codex/validate_instructions.py" \
          TARGET_PROVISIONER="$PWD/target/.codex/provision_global_skills.py" \
          python3 - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path

          def load_tree(path, required):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              definitions = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      definitions.setdefault(node.name, []).append(node.lineno)
              duplicate_required = sorted(
                  name for name in required if len(definitions.get(name, [])) > 1
              )
              if duplicate_required:
                  raise SystemExit(
                      f"{path}: duplicate protected definitions: {', '.join(duplicate_required)}"
                  )
              missing = sorted(set(required) - definitions)
              if missing:
                  raise SystemExit(f"{path}: missing required definitions: {', '.join(missing)}")
              return tree

          validator = load_tree(Path(os.environ["TARGET_VALIDATOR"]), {"parse_yaml_mapping", "validate_asset", "main"})
          provisioner_path = Path(os.environ["TARGET_PROVISIONER"])
          provisioner = load_tree(provisioner_path, {"load_manifest", "verify_registry", "tree_digest", "main"})

          # Approved target code is contributor-controlled and must not be
          # imported or executed inside pull_request_target. Check its
          # executable shape and immutable-pin constants as data only; the
          # trusted validator below remains the only code executed on target
          # contents in this job.
          for tree, forbidden in ((validator, {"exec", "eval", "__import__"}), (provisioner, {"exec", "eval", "__import__"})):
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in forbidden:
                      raise SystemExit(f"approved governance code uses forbidden dynamic call: {node.func.id}")

          def assignment(tree, name):
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == name for target in node.targets):
                      try:
                          return ast.literal_eval(node.value)
                      except (ValueError, SyntaxError):
                          raise SystemExit(f"approved governance constant {name} must be a literal")
              raise SystemExit(f"approved governance constant {name} is missing")

          def function_node(tree, name):
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      return node
              raise SystemExit(f"approved validator is missing function {name}")

          def check_module_entrypoint(tree, label):
              """Require a guarded, failure-propagating call to the inspected main."""

              for node in tree.body:
                  if not isinstance(node, ast.If):
                      continue
                  test = node.test
                  guarded = (
                      isinstance(test, ast.Compare)
                      and len(test.ops) == 1
                      and isinstance(test.ops[0], ast.Eq)
                      and (
                          (isinstance(test.left, ast.Name) and test.left.id == "__name__"
                           and len(test.comparators) == 1
                           and isinstance(test.comparators[0], ast.Constant)
                           and test.comparators[0].value == "__main__")
                          or
                          (len(test.comparators) == 1
                           and isinstance(test.comparators[0], ast.Name)
                           and test.comparators[0].id == "__name__"
                           and isinstance(test.left, ast.Constant)
                           and test.left.value == "__main__")
                      )
                  )
                  if not guarded:
                      continue
                  main_calls = []
                  for statement in node.body:
                      for call in ast.walk(statement):
                          if isinstance(call, ast.Call) and isinstance(call.func, ast.Name) and call.func.id == "main":
                              main_calls.append(call)
                  if not main_calls:
                      raise SystemExit(f"approved {label} module entrypoint does not call main")
                  propagating = False
                  for statement in node.body:
                      if isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call):
                          outer = statement.value
                          if (
                              isinstance(outer.func, ast.Attribute)
                              and isinstance(outer.func.value, ast.Name)
                              and outer.func.value.id == "sys"
                              and outer.func.attr == "exit"
                              and any(call in outer.args for call in main_calls)
                          ):
                              propagating = True
                      if isinstance(statement, ast.Raise) and isinstance(statement.exc, ast.Call):
                          outer = statement.exc
                          if (
                              isinstance(outer.func, ast.Name)
                              and outer.func.id == "SystemExit"
                              and any(call in outer.args for call in main_calls)
                          ):
                              propagating = True
                  if not propagating:
                      raise SystemExit(f"approved {label} module entrypoint must propagate main status")
                  return
              raise SystemExit(f"approved {label} is missing an __main__ entrypoint")

          def constant_truth(node):
              if isinstance(node, ast.Constant):
                  return bool(node.value)
              if isinstance(node, ast.UnaryOp) and isinstance(node.op, ast.Not):
                  inner = constant_truth(node.operand)
                  return None if inner is None else not inner
              if isinstance(node, ast.Compare) and len(node.ops) == len(node.comparators):
                  values = [node.left, *node.comparators]
                  if not all(isinstance(value, ast.Constant) for value in values):
                      return None
                  result = True
                  for left, op, right in zip(values, node.ops, node.comparators):
                      left_value = left.value
                      right_value = right.value
                      if isinstance(op, ast.Eq):
                          result = result and left_value == right_value
                      elif isinstance(op, ast.NotEq):
                          result = result and left_value != right_value
                      elif isinstance(op, ast.Is):
                          result = result and left_value is right_value
                      elif isinstance(op, ast.IsNot):
                          result = result and left_value is not right_value
                      else:
                          return None
                  return result
              return None

          class ReachableCalls(ast.NodeVisitor):
              def __init__(self):
                  self.names = set()
                  self.direct_calls = {}
                  self.strings = set()
                  self.calls = {}
                  self.returns = []

              def visit_Call(self, node):
                  if isinstance(node.func, ast.Name):
                      name = node.func.id
                      self.direct_calls.setdefault(name, []).append(node.lineno)
                  elif isinstance(node.func, ast.Attribute):
                      name = node.func.attr
                  else:
                      name = None
                  if name:
                      self.names.add(name)
                      self.calls.setdefault(name, []).append(node.lineno)
                  self.generic_visit(node)

              def visit_Return(self, node):
                  self.returns.append(node.lineno)
                  self.generic_visit(node)

              def visit_Constant(self, node):
                  if isinstance(node.value, str):
                      self.strings.add(node.value)

              def visit_If(self, node):
                  self.visit(node.test)
                  truth = constant_truth(node.test)
                  branch = node.body if truth is True else node.orelse if truth is False else node.body + node.orelse
                  for child in branch:
                      self.visit(child)

              def visit_While(self, node):
                  self.visit(node.test)
                  truth = constant_truth(node.test)
                  branch = node.body if truth is not False else node.orelse
                  for child in branch:
                      self.visit(child)

              def visit_FunctionDef(self, node):
                  # Nested functions are not part of the enclosing function's
                  # reachable validation path.
                  return

              visit_AsyncFunctionDef = visit_FunctionDef

              def visit_Lambda(self, node):
                  return

          def reachable_called_names(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor.names

          def reachable_string_literals(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor.strings

          def reachable_info(node):
              visitor = ReachableCalls()
              for statement in node.body:
                  visitor.visit(statement)
              return visitor

          def function_bindings(node):
              """Return names locally rebound inside one function."""

              bindings = {argument.arg for argument in node.args.posonlyargs + node.args.args + node.args.kwonlyargs}
              if node.args.vararg:
                  bindings.add(node.args.vararg.arg)
              if node.args.kwarg:
                  bindings.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Store):
                      bindings.add(child.id)
              return bindings

          def direct_terminator_lines(statements):
              """Find unconditional return/raise statements in a body."""

              lines = []
              for statement in statements:
                  if isinstance(statement, (ast.Return, ast.Raise)):
                      lines.append(statement.lineno)
                      continue
                  if isinstance(statement, ast.If):
                      truth = constant_truth(statement.test)
                      branch = statement.body if truth is True else statement.orelse if truth is False else None
                      if branch is not None:
                          lines.extend(direct_terminator_lines(branch))
              return lines

          def check_validator_shape(tree):
              parse_yaml = function_node(tree, "parse_yaml_mapping")
              validate = function_node(tree, "validate_asset")
              main = function_node(tree, "main")
              required_calls = {
                  "parse_yaml_mapping": (parse_yaml, {"_parse_scalar"}),
                  "validate_asset": (validate, {"validate_skill", "_validate_instruction_file", "_validate_global_manifest"}),
                  "main": (main, {"validate_asset"}),
              }
              for label, (node, required_names) in required_calls.items():
                  info = reachable_info(node)
                  bindings = function_bindings(node)
                  shadowed = sorted(required_names & bindings)
                  if shadowed:
                      raise SystemExit(f"approved validator {label} shadows required calls: {', '.join(shadowed)}")
                  missing = sorted(required_names - set(info.direct_calls))
                  if missing:
                      raise SystemExit(f"approved validator {label} is missing operational calls: {', '.join(missing)}")
                  for name in required_names:
                      call_lines = info.direct_calls.get(name, [])
                      terminators = info.returns + direct_terminator_lines(node.body)
                      if call_lines and any(line < min(call_lines) for line in terminators):
                          raise SystemExit(f"approved validator {label} can terminate before calling {name}")
              if not any(isinstance(node, (ast.For, ast.While, ast.If, ast.Try)) for node in ast.walk(parse_yaml)):
                  raise SystemExit("approved validator parse_yaml_mapping has no parsing control flow")
              if not any(isinstance(node, (ast.For, ast.While, ast.If, ast.Try)) for node in ast.walk(validate)):
                  raise SystemExit("approved validator validate_asset has no validation control flow")
              if not any(isinstance(node, ast.Try) for node in ast.walk(main)):
                  raise SystemExit("approved validator main has no guarded validation path")

          # Exercise the checker itself against a controlled no-op fixture;
          # this remains data-only and never imports or executes contributor
          # code in pull_request_target.
          no_op_fixture = ast.parse(
              "def parse_yaml_mapping(): return {}\n"
              "def validate_asset(): return {'ok': True}\n"
              "def main(): return 0\n"
          )
          try:
              check_validator_shape(no_op_fixture)
          except SystemExit:
              pass
          else:
              raise SystemExit("validator semantic fixture unexpectedly passed")
          check_validator_shape(validator)
          check_module_entrypoint(validator, "validator")

          def check_provisioner_shape(tree):
              required_calls = {
                  "load_manifest": (function_node(tree, "load_manifest"), {"loads"}),
                  "verify_registry": (function_node(tree, "verify_registry"), {"check_output", "loads"}),
                  "tree_digest": (function_node(tree, "tree_digest"), {"sha256", "rglob"}),
                  "main": (function_node(tree, "main"), {"load_manifest", "verify_registry", "tree_digest"}),
              }
              for label, (node, required_names) in required_calls.items():
                  missing = sorted(required_names - reachable_called_names(node))
                  if missing:
                      raise SystemExit(f"approved provisioner {label} is missing operational calls: {', '.join(missing)}")
                  info = reachable_info(node)
                  for name in required_names:
                      call_lines = info.calls.get(name, [])
                      if call_lines and any(line < min(call_lines) for line in info.returns):
                          raise SystemExit(f"approved provisioner {label} can return before calling {name}")
              if "archive" not in reachable_string_literals(function_node(tree, "verify_registry")):
                  raise SystemExit("approved provisioner verify_registry is missing the git archive operation")

          dead_validator_fixture = ast.parse(
              "def parse_yaml_mapping():\n  if False: _parse_scalar()\n  return {}\n"
              "def validate_asset():\n  if False: validate_skill(); _validate_instruction_file(); _validate_global_manifest()\n  return {'ok': True}\n"
              "def main():\n  if 1 == 0: validate_asset()\n  return 0\n"
          )
          try:
              check_validator_shape(dead_validator_fixture)
          except SystemExit:
              pass
          else:
              raise SystemExit("dead-code validator fixture unexpectedly passed")
          short_circuit_fixture = ast.parse(
              "def parse_yaml_mapping():\n  _parse_scalar(); return {}\n"
              "def validate_asset():\n  validate_skill(); _validate_instruction_file(); _validate_global_manifest(); return {'ok': True}\n"
              "def main():\n  if sys.argv: return 0\n  validate_asset()\n"
          )
          try:
              check_validator_shape(short_circuit_fixture)
          except SystemExit:
              pass
          else:
              raise SystemExit("short-circuit validator fixture unexpectedly passed")
          check_provisioner_shape(provisioner)
          dead_provisioner_fixture = ast.parse(
              "def load_manifest():\n  if False: loads()\n"
              "def verify_registry():\n  if False: check_output(); loads(); 'archive'\n"
              "def tree_digest():\n  if False: sha256(); rglob()\n"
              "def main():\n  if False: load_manifest(); verify_registry(); tree_digest()\n"
          )
          try:
              check_provisioner_shape(dead_provisioner_fixture)
          except SystemExit:
              pass
          else:
              raise SystemExit("dead-code provisioner fixture unexpectedly passed")
          check_module_entrypoint(provisioner, "provisioner")

          manifest = json.loads(Path("target/.codex/global-skills.json").read_text(encoding="utf-8"))
          contract = json.loads(Path("target/.codex/instruction-integrity.json").read_text(encoding="utf-8"))
          if assignment(provisioner, "EXPECTED_REGISTRY") != manifest.get("registry"):
              raise SystemExit("approved provisioner registry pin does not match the manifest")
          if assignment(provisioner, "EXPECTED_SOURCE_REVISION") != contract.get("canonical_config_commit"):
              raise SystemExit("approved provisioner source revision does not match the contract")
          if assignment(validator, "GLOBAL_REGISTRY_DESCRIPTOR") != manifest.get("registry"):
              raise SystemExit("approved validator registry pin does not match the manifest")
          if assignment(validator, "CANONICAL_CONFIG_COMMIT") != contract.get("canonical_config_commit"):
              raise SystemExit("approved validator source revision does not match the contract")

          # Parse the proposed workflow without executing any contributor
          # YAML or action. Ruby/Psych is present on the hosted runner.
          print("approved governance code shape and pins validated without execution")
          PY
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)' target/.github/workflows/instruction-integrity.yml
          ruby -ryaml - target/.github/workflows/instruction-integrity.yml <<'RUBY'
            workflow = YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)
            events = workflow["on"] || workflow[true]
            raise "missing pull_request_target event" unless events.is_a?(Hash)
            target = events["pull_request_target"]
            types = target.is_a?(Hash) ? Array(target["types"]).map(&:to_s) : []
            required = %w[opened synchronize reopened labeled unlabeled edited]
            raise "pull_request_target types are incomplete" unless required.all? { |item| types.include?(item) }
            pull_request = events["pull_request"]
            raise "pull_request bootstrap event is missing" unless pull_request.is_a?(Hash)
            bootstrap_paths = Array(pull_request["paths"]).map(&:to_s)
            required_paths = %w[AGENTS.md CLAUDE.md .agents/** .codex/** .github/workflows/instruction-integrity.yml]
            raise "pull_request bootstrap paths are incomplete" unless required_paths.all? { |item| bootstrap_paths.include?(item) }
            raise "pull_request_target must not be path-filtered" if target.is_a?(Hash) && (target.key?("paths") || target.key?("paths-ignore"))
            push = events["push"]
            raise "push event is missing" unless push.is_a?(Hash)
            push_branches = Array(push["branches"]).map(&:to_s)
            raise "protected branch push gate is missing" unless %w[main master].all? { |item| push_branches.include?(item) }
            raise "push gate must not be path-filtered" if push.key?("paths") || push.key?("paths-ignore")
            jobs = workflow["jobs"]
            raise "missing bootstrap/validate jobs" unless jobs.is_a?(Hash) && jobs["bootstrap"].is_a?(Hash) && jobs["validate"].is_a?(Hash)
            raise "unexpected workflow job is present" unless jobs.keys.map(&:to_s).sort == %w[bootstrap validate]
            jobs.each do |job_name, job|
              next unless job.is_a?(Hash)
              raise "job-level permissions are not allowed: #{job_name}" if job.key?("permissions")
              raise "job-level failure suppression is not allowed: #{job_name}" if job.key?("continue-on-error")
            end
            bootstrap = jobs["bootstrap"]
            gate = jobs["validate"]
            raise "bootstrap is not limited to pull_request" unless bootstrap["if"].to_s.include?("github.event_name == 'pull_request'")
            raise "head-associated required check name is missing" unless bootstrap["name"].to_s == "instruction-integrity"
            raise "trusted gate name is missing" unless gate["name"].to_s == "instruction-integrity-trusted"
            gate_condition = gate["if"].to_s.gsub(/\s+/, " ").strip
            expected_gate_condition = "github.event_name == 'pull_request_target' || github.event_name == 'push'"
            raise "trusted gate condition is incomplete or disabled" unless gate_condition == expected_gate_condition
            expected_approval = "${{ github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'instruction-governance-approved' && contains(github.event.pull_request.labels.*.name, 'instruction-governance-approved') && github.event.sender.login == github.repository_owner }}"
            raise "approval expression is incomplete or broadened" unless gate.dig("env", "GOVERNANCE_UPDATE_APPROVED").to_s == expected_approval
            checkout = lambda do |job, path|
              Array(job["steps"]).find do |step|
                step.is_a?(Hash) && step["uses"].to_s.start_with?("actions/checkout@") && step.dig("with", "path").to_s == path
              end
            end
            target_bootstrap = checkout.call(bootstrap, "target")
            target_gate = checkout.call(gate, "target")
            trusted_gate = checkout.call(gate, "trusted")
            trusted_bootstrap = checkout.call(bootstrap, "trusted")
            raise "bootstrap checkout must pin pull request head" unless target_bootstrap&.dig("with", "ref").to_s == "${{ github.event.pull_request.head.sha }}"
            raise "bootstrap trusted checkout must pin pull request base" unless trusted_bootstrap&.dig("with", "ref").to_s == "${{ github.event.pull_request.base.sha }}"
            raise "target checkout must pin pull request head" unless target_gate&.dig("with", "ref").to_s == "${{ github.event.pull_request.head.sha || github.sha }}"
            raise "trusted checkout must pin pull request base" unless trusted_gate&.dig("with", "ref").to_s == "${{ github.event.pull_request.base.sha || github.sha }}"
            permissions = workflow["permissions"]
            raise "workflow must grant only contents: read" unless permissions.is_a?(Hash) && permissions.keys.map(&:to_s) == ["contents"] && permissions["contents"].to_s == "read"
            bootstrap_steps = Array(bootstrap["steps"])
            head_validator = bootstrap_steps.find { |step| step.is_a?(Hash) && step["name"].to_s == "Validate pull request head with trusted validator" }
            raise "head-associated trusted validator step is missing" unless head_validator
            raise "head validator step may be conditionally skipped" if head_validator.key?("if") && !head_validator["if"].to_s.strip.empty?
            raise "head validator step may not ignore failures" if head_validator["continue-on-error"] == true || head_validator["continue-on-error"].to_s.casecmp("true").zero?
            head_run = head_validator["run"].to_s
            raise "head validator must invoke the trusted validator" unless head_run.match?(/\A\s*python3\s+trusted\/\.codex\/validate_instructions\.py(?:\s|\\)/)
            [
              "--repo target",
              "--contract target/.codex/instruction-integrity.json",
              "--policy target/.codex/instruction-policy.v1.json",
              "--trusted-contract trusted/.codex/instruction-integrity.json",
              "--trusted-policy trusted/.codex/instruction-policy.v1.json",
            ].each do |needle|
              raise "head validator command is missing #{needle}" unless head_run.include?(needle)
            end
            steps = Array(gate["steps"])
              allowed_trusted_steps = ["Verify pinned global registry contents", "Protect the integrity gate files", "Protect instruction contents unless explicitly approved", "Validate AGENTS.md and skills"]
            steps.each do |step|
              next unless step.is_a?(Hash)
              run_text = step["run"].to_s
              next if run_text.empty?
              if run_text.match?(/\btrusted(?:\/|\b)/)
                unless allowed_trusted_steps.include?(step["name"].to_s)
                  raise "untrusted workflow step references the trusted checkout"
                end
                  if run_text.lines.any? { |line| line.match?(/^\s*(?:cp|install|mkdir|mv|rm|rmdir|touch|truncate|tee|cat|echo|printf)\b[^\n]*\btrusted(?:\/|\b)/) || line.match?(/^\s*(?:python3|ruby|perl|sed)\b[^\n]*(?:>>?|\|\s*tee\b)[^\n]*\btrusted(?:\/|\b)/) || line.match?(/\b(?:write_text|write_bytes|unlink|rename|replace|mkdir)\b[^\n]*\btrusted(?:\/|\b)/) }
                  raise "workflow step can mutate the trusted checkout"
                end
              end
              if step["working-directory"].to_s == "trusted"
                raise "workflow step may not execute from the trusted checkout"
              end
            end
            gate_files_step = steps.find { |step| step.is_a?(Hash) && step["name"].to_s == "Protect the integrity gate files" }
            raise "integrity gate-file protection step is missing" unless gate_files_step
            raise "integrity gate-file protection may be conditionally skipped" if gate_files_step.key?("if") && !gate_files_step["if"].to_s.strip.empty?
            raise "integrity gate-file protection may not ignore failures" if gate_files_step["continue-on-error"] == true || gate_files_step["continue-on-error"].to_s.casecmp("true").zero?
            gate_files_run = gate_files_step["run"].to_s
            [
              "approved=\"$GOVERNANCE_UPDATE_APPROVED\"",
              "for file in",
              "cmp -s \"trusted/$file\" \"target/$file\"",
              "echo \"governance gate file changed: $file\"",
              "exit 1",
              "test -s \"target/$file\"",
            ].each do |needle|
              raise "integrity gate-file protection is incomplete: #{needle}" unless gate_files_run.include?(needle)
            end
            validate_step = steps.find { |step| step.is_a?(Hash) && step["name"].to_s == "Validate AGENTS.md and skills" }
            raise "trusted validator step is missing" unless validate_step
            raise "trusted validator step may be conditionally skipped" if validate_step.key?("if") && !validate_step["if"].to_s.strip.empty?
            raise "trusted validator step may not ignore failures" if validate_step["continue-on-error"] == true || validate_step["continue-on-error"].to_s.casecmp("true").zero?
            run = validate_step["run"].to_s
            raise "trusted validator step disables errexit" if run.lines.any? { |line| line.strip.match?(/\Aset\s+\+(?:e|o\s+errexit)\b/) }
            logical_commands = []
            current = ""
            run.each_line do |line|
              piece = line.strip
              if piece.end_with?("\\")
                current << piece[0...-1] << " "
              else
                logical_commands << (current + piece)
                current = ""
              end
            end
            logical_commands << current unless current.empty?
            command = logical_commands.find do |line|
              line.match?(/\A(?:[A-Z_][A-Z0-9_]*=\S+\s+)*python3\s+trusted\/\.codex\/validate_instructions\.py(?:\s|\z)/)
            end
            raise "trusted validator command is missing or not executable" unless command
            %w[--registry-only --help --version].each do |forbidden|
              raise "trusted validator command contains a bypass flag: #{forbidden}" if command.split.include?(forbidden)
              if run.lines.any? { |line| line.match?(/\bextra_args\s*\+?=.*#{Regexp.escape(forbidden)}/) }
                raise "trusted validator arguments contain a bypass flag: #{forbidden}"
              end
            end
            %w[--trusted-policy --trusted-contract --registry-source].each do |needle|
              raise "trusted validator command is missing #{needle}" unless command.split.include?(needle) || command.include?("#{needle} ")
            end
            raise "trusted validator command must be standalone and failure-propagating" if command.match?(/[;&|<>]/)
            %w[AGENTS.md .codex/global-skills.json .codex/provision_global_skills.py].each do |needle|
              raise "bootstrap protection is missing #{needle}" unless steps.any? { |step| step.is_a?(Hash) && step["run"].to_s.include?(needle) }
            end
            protection_step = steps.find { |step| step.is_a?(Hash) && step["name"].to_s == "Protect instruction contents unless explicitly approved" }
            raise "instruction protection step is missing" unless protection_step
            raise "instruction protection step has an unexpected condition" unless protection_step["if"].to_s.strip == "env.GOVERNANCE_UPDATE_APPROVED != 'true'"
            raise "instruction protection step may not ignore failures" if protection_step["continue-on-error"] == true || protection_step["continue-on-error"].to_s.casecmp("true").zero?
            protection_run = protection_step["run"].to_s
            ["def surface", "trusted_files = surface", "target_files = surface", "hashlib.sha256", "raise SystemExit"].each do |needle|
              raise "instruction protection step is incomplete: #{needle}" unless protection_run.include?(needle)
            end
            raise "instruction protection step does not compare trusted and target surfaces" unless protection_run.include?("set(trusted_files) != set(target_files)") && protection_run.include?("target_files[relative]")
          RUBY
          fi
      - name: Protect instruction contents unless explicitly approved
        if: env.GOVERNANCE_UPDATE_APPROVED != 'true'
        run: |
          if test ! -f trusted/.codex/instruction-integrity.json; then
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import stat
          import sys
          from pathlib import Path

          trusted_root = Path("trusted")
          target_root = Path("target")
          contract = json.loads((trusted_root / ".codex/instruction-integrity.json").read_text())
          sys.path.insert(0, str((trusted_root / ".codex").resolve()))
          from validate_instructions import REFERENCE_TEXT_SUFFIXES, _is_within, _markdown_targets

          def surface(root, raw_paths):
              files = {}
              paths = {Path(raw) for raw in raw_paths}
              # AGENTS.override.md is a scoped instruction surface even when
              # it is not listed in the root contract. Include every tracked
              # override so adding or editing one cannot bypass protection.
              for item in root.rglob("*"):
                  relative = item.relative_to(root)
                  if any(part in {".git", "node_modules", ".next"} for part in relative.parts):
                      continue
                  if item.name in {"AGENTS.md", "AGENTS.override.md", "CLAUDE.md"}:
                      paths.add(relative)
              for relative in sorted(paths, key=str):
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"trusted contract path is not repository-relative: {relative}")
                  path = root / relative
                  if path.is_symlink():
                      raise SystemExit(f"governed instruction may not be a symlink: {relative}")
                  if path.is_file():
                      candidates = [path]
                  elif path.is_dir():
                      if path.is_symlink():
                          raise SystemExit(f"governed instruction directory may not be a symlink: {relative}")
                      candidates = []
                      for item in path.rglob("*"):
                          if item.is_symlink():
                              raise SystemExit(f"governed instruction may not be a symlink: {item.relative_to(root)}")
                          if item.is_file():
                              candidates.append(item)
                  else:
                      raise SystemExit(f"required instruction missing from trusted/target tree: {relative}")
                  for item in candidates:
                      if item.is_symlink():
                          raise SystemExit(f"governed instruction may not be a symlink: {item.relative_to(root)}")
                      item_relative = item.relative_to(root)
                      files[str(item_relative)] = (
                          hashlib.sha256(item.read_bytes()).hexdigest(),
                          stat.S_IMODE(item.stat().st_mode),
                      )
              pending = list(files)
              seen: set[str] = set()
              repo_root = root.resolve()
              while pending:
                  relative = pending.pop()
                  if relative in seen:
                      continue
                  seen.add(relative)
                  path = root / relative
                  if path.suffix.casefold() not in REFERENCE_TEXT_SUFFIXES or not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8")
                  for raw_target in _markdown_targets(text):
                      target = raw_target.strip().split("#", 1)[0].strip()
                      if not target or target.startswith(("http://", "https://", "mailto:", "data:", "#")):
                          continue
                      lexical = path.parent / target
                      candidate = lexical.resolve()
                      if lexical.is_symlink():
                          raise SystemExit(f"governed referenced instruction may not be a symlink: {lexical.relative_to(root)}")
                      if not candidate.is_file() or candidate.suffix.casefold() not in REFERENCE_TEXT_SUFFIXES:
                          continue
                      if not _is_within(candidate, repo_root):
                          continue
                      referenced = str(candidate.relative_to(repo_root))
                      if referenced not in files:
                          files[referenced] = (
                              hashlib.sha256(candidate.read_bytes()).hexdigest(),
                              stat.S_IMODE(candidate.stat().st_mode),
                          )
                          pending.append(referenced)
              return files

          paths = list(contract.get("required_agents", [])) + list(contract.get("required_skills", []))
          trusted_files = surface(trusted_root, paths)
          target_files = surface(target_root, paths)
          if set(trusted_files) != set(target_files):
              raise SystemExit("governed instruction surface changed without instruction-governance-approved label")
          for relative, digest in trusted_files.items():
              if target_files[relative] != digest:
                  raise SystemExit(f"governed instruction changed without instruction-governance-approved label: {relative}")
          PY
      - name: Validate AGENTS.md and skills
        run: |
          expected_config_commit="$(python3 -c 'import json; print(json.load(open("trusted/.codex/instruction-integrity.json", encoding="utf-8"))["canonical_config_commit"])')"
          extra_args=()
          if test "$GOVERNANCE_UPDATE_APPROVED" = true; then
            extra_args+=(--allow-config-commit-update)
          fi
          python3 trusted/.codex/validate_instructions.py "${extra_args[@]}" \
            --repo target \
            --contract target/.codex/instruction-integrity.json \
            --policy target/.codex/instruction-policy.v1.json \
            --trusted-policy trusted/.codex/instruction-policy.v1.json \
            --trusted-contract trusted/.codex/instruction-integrity.json \
            --expected-config-commit "$expected_config_commit" \
            --registry-source registry-source \
            --json
