name: instruction-integrity

on:
  # The base-branch workflow is trusted; the proposed checkout is data only.
  pull_request_target:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: instruction-integrity-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: instruction-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed tree (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false
      - name: Checkout trusted base contract and validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Validate AGENTS.md and skills
        run: |
          expected_config_commit="$(python3 -c 'import json; print(json.load(open("trusted/.codex/instruction-integrity.json", encoding="utf-8"))["canonical_config_commit"])')"
          python3 trusted/.codex/validate_instructions.py \
            --repo target \
            --contract target/.codex/instruction-integrity.json \
            --policy trusted/.codex/instruction-policy.v1.json \
            --trusted-contract trusted/.codex/instruction-integrity.json \
            --expected-config-commit "$expected_config_commit" \
            --json
